xt x="325" y="334" font-size="22" fill="#172c40" text-anchor="start">in: 空</text><rect x="615" y="301" width="340" height="48" rx="6" fill="#d4efdf" stroke="#667c90" stroke-width="2"/><text x="630" y="334" font-size="22" fill="#172c40" text-anchor="start">out: C,B,A</text><text x="24" y="407" font-size="22" fill="#172c40" text-anchor="start">弹out，返回A</text><rect x="310" y="373" width="270" height="48" rx="6" fill="#e3f0fb" stroke="#667c90" stroke-width="2"/><text x="325" y="406" font-size="22" fill="#172c40" text-anchor="start">in: 空</text><rect x="615" y="373" width="340" height="48" rx="6" fill="#d4efdf" stroke="#667c90" stroke-width="2"/><text x="630" y="406" font-size="22" fill="#172c40" text-anchor="start">out: C,B</text><text x="24" y="479" font-size="22" fill="#172c40" text-anchor="start">再入D</text><rect x="310" y="445" width="270" height="48" rx="6" fill="#e3f0fb" stroke="#667c90" stroke-width="2"/><text x="325" y="478" font-size="22" fill="#172c40" text-anchor="start">in: D</text><rect x="615" y="445" width="340" height="48" rx="6" fill="#d4efdf" stroke="#667c90" stroke-width="2"/><text x="630" y="478" font-size="22" fill="#172c40" text-anchor="start">out: C,B</text><text x="24" y="551" font-size="22" fill="#172c40" text-anchor="start">弹out，返回B</text><rect x="310" y="517" width="270" height="48" rx="6" fill="#e3f0fb" stroke="#667c90" stroke-width="2"/><text x="325" y="550" font-size="22" fill="#172c40" text-anchor="start">in: D</text><rect x="615" y="517" width="340" height="48" rx="6" fill="#d4efdf" stroke="#667c90" stroke-width="2"/><text x="630" y="550" font-size="22" fill="#172c40" text-anchor="start">out: C</text><text x="24" y="635" font-size="22" fill="#172c40" text-anchor="start">队列顺序=out从顶到底，再接in从底到顶。</text></g></svg>
