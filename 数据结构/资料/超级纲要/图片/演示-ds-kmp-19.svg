<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 365" width="800" height="365"><title>KMP：失败时保留已经匹配的字符</title><rect width="800" height="365" fill="#ffffff"/><text x="20" y="28" font-size="19" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">KMP：失败时保留已经匹配的字符</text><g transform="translate(0,45)"><text x="20" y="26" font-size="20" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">19. 模式完整出现</text><g transform="translate(0,48)"><text x="20" y="82" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">文本</text><rect x="140.0" y="55" width="75.75" height="42" rx="3" fill="#f5f8f6" stroke="#c6d2cc"></rect><text x="150.0" y="83" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">A</text><text x="150.0" y="115" font-size="12" fill="#596c64" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">0</text><rect x="218.75" y="55" width="75.75" height="42" rx="3" fill="#f5f8f6" stroke="#c6d2cc"></rect><text x="228.75" y="83" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">B</text><text x="228.75" y="115" font-size="12" fill="#596c64" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">1</text><rect x="297.5" y="55" width="75.75" height="42" rx="3" fill="#ffe2b6" stroke="#c6d2cc"></rect><text x="307.5" y="83" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">A</text><text x="307.5" y="115" font-size="12" fill="#596c64" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">2</text><rect x="376.25" y="55" width="75.75" height="42" rx="3" fill="#ffe2b6" stroke="#c6d2cc"></rect><text x="386.25" y="83" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">B</text><text x="386.25" y="115" font-size="12" fill="#596c64" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">3</text><rect x="455.0" y="55" width="75.75" height="42" rx="3" fill="#ffe2b6" stroke="#c6d2cc"></rect><text x="465.0" y="83" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">A</text><text x="465.0" y="115" font-size="12" fill="#596c64" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">4</text><rect x="533.75" y="55" width="75.75" height="42" rx="3" fill="#ffe2b6" stroke="#c6d2cc"></rect><text x="543.75" y="83" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">B</text><text x="543.75" y="115" font-size="12" fill="#596c64" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">5</text><rect x="612.5" y="55" width="75.75" height="42" rx="3" fill="#ffe2b6" stroke="#c6d2cc"></rect><text x="622.5" y="83" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">A</text><text x="622.5" y="115" font-size="12" fill="#596c64" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">6</text><rect x="691.25" y="55" width="75.75" height="42" rx="3" fill="#ffe2b6" stroke="#c6d2cc"></rect><text x="701.25" y="83" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">C</text><text x="701.25" y="115" font-size="12" fill="#596c64" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">7</text></g><text x="20" y="228" font-size="16" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">起点=i−j=8−6=2，把2记入结果。</text><text x="20" y="253" font-size="16" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">原因：i已移到尾后位置8，j等于模式长度6，前面连续6个字符都已确认匹配。</text><line x1="20" y1="288" x2="780" y2="288" stroke="#c6d2cc"></line></g></svg>
