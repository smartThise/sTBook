<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 392" width="740" height="392"><title>Huffman贪心合并：2,3,5,8</title><rect width="740" height="392" fill="#ffffff"/><text x="24" y="30" font-size="18" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">Huffman贪心合并：2,3,5,8</text><text x="716" y="30" font-size="13" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="end">第 3 / 5 步</text><g transform="translate(0,46)"><text x="24" y="24" font-size="17" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">3. 合并C5与5A → 权10</text><g transform="translate(0,36)"><text x="40" y="30" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">Huffman贪心：森林F中取出权重最小的两棵合并，插回森林</text><rect x="60" y="90" width="130" height="64" rx="10" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="125" y="118" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">D8</text><text x="125" y="140" font-size="13" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">w=8</text><rect x="210" y="90" width="130" height="64" rx="10" fill="#ffe9c4" stroke="#e0a243" stroke-width="1.5"/><text x="275" y="118" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">10C</text><text x="275" y="140" font-size="13" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">w=5</text><text x="40" y="210" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">新的最小两个：C(5)与刚合成的5A。合并为10。</text></g><text x="24" y="302" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">新的最小两个：C(5)与刚合成的5A。合并为10。</text><text x="24" y="326" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">为什么：刚合成的树立即参与后续比较。</text><line x1="24" y1="338" x2="716" y2="338" stroke="#d5dfda"/></g></svg>