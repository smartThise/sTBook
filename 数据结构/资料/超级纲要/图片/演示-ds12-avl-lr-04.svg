<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 442" width="720" height="442"><title>AVL双旋：LR失衡与复衡</title><rect width="720" height="442" fill="#ffffff"/><text x="24" y="30" font-size="18" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">AVL双旋：LR失衡与复衡</text><text x="696" y="30" font-size="13" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="end">第 4 / 4 步</text><g transform="translate(0,46)"><text x="24" y="24" font-size="17" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">4. 结果</text><g transform="translate(0,36)"><text x="40" y="30" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">恢复平衡。</text><line x1="290" y1="116" x2="170" y2="182" stroke="#d5dfda" stroke-width="2"/><line x1="290" y1="116" x2="410" y2="182" stroke="#d5dfda" stroke-width="2"/><rect x="254" y="84" width="72" height="44" rx="10" fill="#d9eaf9" stroke="#6d9dd6" stroke-width="1.5"/><text x="290" y="110" font-size="18" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">4</text><rect x="134" y="184" width="72" height="44" rx="10" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="170" y="210" font-size="18" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">3</text><rect x="374" y="184" width="72" height="44" rx="10" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="410" y="210" font-size="18" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">5</text><text x="40" y="266" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">双旋完成。</text><text x="40" y="290" font-size="14" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">为什么：单旋LL/RR同理：p与v同侧时只需一次旋转。</text></g><text x="24" y="352" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">AVL性质恢复：新根4的balFac=0，3、5的balFac=0。</text><text x="24" y="376" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">为什么：高度复原：插入后的复衡只需局部双旋，更高祖先不受影响。</text><line x1="24" y1="388" x2="696" y2="388" stroke="#d5dfda"/></g></svg>