<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 378" width="780" height="378"><title>跳跃版起泡：last怎样让区间跳跃收缩</title><rect width="780" height="378" fill="#ffffff"/><text x="24" y="30" font-size="18" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">跳跃版起泡：last怎样让区间跳跃收缩</text><text x="756" y="30" font-size="13" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="end">第 12 / 12 步</text><g transform="translate(0,46)"><text x="24" y="24" font-size="17" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">12. 第2趟结束：last=0，hi=0</text><g transform="translate(0,36)"><text x="50" y="30" font-size="15" fill="#5c6f68" font-family="Menlo, Consolas, monospace" text-anchor="start">跳跃版：本趟扫描区间[lo, hi)=[0, 0)，last=0</text><rect x="50" y="96" width="58" height="44" rx="8" fill="#d9f0e2" stroke="#6cb98d" stroke-width="1.5"/><text x="79.0" y="124.0" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">1</text><text x="79.0" y="156" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">0</text><rect x="110" y="96" width="58" height="44" rx="8" fill="#d9f0e2" stroke="#6cb98d" stroke-width="1.5"/><text x="139.0" y="124.0" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">2</text><text x="139.0" y="156" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">1</text><rect x="170" y="96" width="58" height="44" rx="8" fill="#d9f0e2" stroke="#6cb98d" stroke-width="1.5"/><text x="199.0" y="124.0" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">3</text><text x="199.0" y="156" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">2</text><rect x="230" y="96" width="58" height="44" rx="8" fill="#d9f0e2" stroke="#6cb98d" stroke-width="1.5"/><text x="259.0" y="124.0" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">4</text><text x="259.0" y="156" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">3</text><rect x="290" y="96" width="58" height="44" rx="8" fill="#d9f0e2" stroke="#6cb98d" stroke-width="1.5"/><text x="319.0" y="124.0" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">5</text><text x="319.0" y="156" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">4</text><rect x="350" y="96" width="58" height="44" rx="8" fill="#d9f0e2" stroke="#6cb98d" stroke-width="1.5"/><text x="379.0" y="124.0" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">6</text><text x="379.0" y="156" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">5</text><rect x="410" y="96" width="58" height="44" rx="8" fill="#d9f0e2" stroke="#6cb98d" stroke-width="1.5"/><text x="439.0" y="124.0" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">7</text><text x="439.0" y="156" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">6</text><text x="50" y="210" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">最好情况O(n)的来源：一趟发现无逆序即收工。</text></g><text x="24" y="288" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">整趟无交换，last保持lo=0，hi=0，循环退出。</text><text x="24" y="312" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">为什么：sorted的语义：一趟无交换即整体有序。总耗时：第1趟6次比较、第2趟3次。</text><line x1="24" y1="324" x2="756" y2="324" stroke="#d5dfda"/></g></svg>