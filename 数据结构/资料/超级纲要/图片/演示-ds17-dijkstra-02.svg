<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 412" width="780" height="412"><title>Dijkstra：S/A/B/C的松弛过程</title><rect width="780" height="412" fill="#ffffff"/><text x="24" y="30" font-size="18" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">Dijkstra：S/A/B/C的松弛过程</text><text x="756" y="30" font-size="13" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="end">第 2 / 5 步</text><g transform="translate(0,46)"><text x="24" y="24" font-size="17" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">2. 取出S，松弛邻居</text><g transform="translate(0,36)"><text x="40" y="30" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">Dijkstra：每步取出dist最小且未定的顶点，松弛其邻居</text><text x="40" y="58" font-size="15" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="start">dist: S=0  A=10  B=3  C=∞</text><text x="40" y="84" font-size="15" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="start">已确定: S</text><rect x="500" y="44" width="200" height="26" rx="8" fill="#ffe9c4" stroke="#e0a243" stroke-width="1.5"/><text x="600.0" y="62.04" font-size="14" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">取出 S</text><text x="40" y="214" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">A:0+10=10；B:0+3=3</text></g><text x="24" y="322" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">S出列确定。松弛A：0+10=10；B：0+3=3。</text><text x="24" y="346" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">为什么：dist单调下降的候选进入优先队列。</text><line x1="24" y1="358" x2="756" y2="358" stroke="#d5dfda"/></g></svg>