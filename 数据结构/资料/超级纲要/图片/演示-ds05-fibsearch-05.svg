<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 402" width="760" height="402"><title>Fibonacci查找：切分点4→6→5</title><rect width="760" height="402" fill="#ffffff"/><text x="24" y="30" font-size="18" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">Fibonacci查找：切分点4→6→5</text><text x="736" y="30" font-size="13" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="end">第 5 / 5 步</text><g transform="translate(0,46)"><text x="24" y="24" font-size="17" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">5. 命中</text><g transform="translate(0,36)"><rect x="30" y="116" width="96" height="46" rx="8" fill="#eef3f0" stroke="#d9e2dd" stroke-width="1.5"/><text x="78.0" y="145.0" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">2</text><text x="78.0" y="178" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">0</text><rect x="128" y="116" width="96" height="46" rx="8" fill="#eef3f0" stroke="#d9e2dd" stroke-width="1.5"/><text x="176.0" y="145.0" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">4</text><text x="176.0" y="178" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">1</text><rect x="226" y="116" width="96" height="46" rx="8" fill="#eef3f0" stroke="#d9e2dd" stroke-width="1.5"/><text x="274.0" y="145.0" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">6</text><text x="274.0" y="178" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">2</text><rect x="324" y="116" width="96" height="46" rx="8" fill="#eef3f0" stroke="#d9e2dd" stroke-width="1.5"/><text x="372.0" y="145.0" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">8</text><text x="372.0" y="178" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">3</text><rect x="422" y="116" width="96" height="46" rx="8" fill="#eef3f0" stroke="#d9e2dd" stroke-width="1.5"/><text x="470.0" y="145.0" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">10</text><text x="470.0" y="178" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">4</text><rect x="520" y="116" width="96" height="46" rx="8" fill="#ffe9c4" stroke="#e0a243" stroke-width="1.5"/><text x="568.0" y="145.0" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">11</text><text x="568.0" y="178" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">5</text><rect x="618" y="116" width="96" height="46" rx="8" fill="#eef3f0" stroke="#d9e2dd" stroke-width="1.5"/><text x="666.0" y="145.0" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">12</text><text x="666.0" y="178" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">6</text><text x="30" y="40" font-size="15" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="start">fib.get() = 1；切分点 mi = lo + fib.get() − 1 = 5</text><text x="30" y="194" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">查找成功。</text><text x="30" y="220" font-size="15" fill="#5c6f68" font-family="Menlo, Consolas, monospace" text-anchor="start">lo=5，hi=6</text></g><text x="24" y="312" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">fibSearch(11) = 5，共探测3次（4→6→5）。</text><text x="24" y="336" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">为什么：黄金分割切分使平均查找长度略优于二分版本A（7元素：4.00对4.14）。</text><line x1="24" y1="348" x2="736" y2="348" stroke="#d5dfda"/></g></svg>