<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 382" width="760" height="382"><title>位图：一个比特回答"有没有"</title><rect width="760" height="382" fill="#ffffff"/><text x="24" y="30" font-size="18" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">位图：一个比特回答"有没有"</text><text x="736" y="30" font-size="13" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="end">第 2 / 4 步</text><g transform="translate(0,46)"><text x="24" y="24" font-size="17" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">2. set(13)</text><g transform="translate(0,36)"><text x="40" y="30" font-size="14" fill="#5c6f68" font-family="Menlo, Consolas, monospace" text-anchor="start">字节1（位8～15）：k=13 → 字节 13&gt;&gt;3=1，位 13&amp;7=5，掩码 0x80&gt;&gt;5 = 0x04</text><rect x="40" y="80" width="78" height="52" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="79" y="112" font-size="19" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">0</text><text x="79" y="148" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">8</text><rect x="124" y="80" width="78" height="52" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="163" y="112" font-size="19" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">0</text><text x="163" y="148" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">9</text><rect x="208" y="80" width="78" height="52" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="247" y="112" font-size="19" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">0</text><text x="247" y="148" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">10</text><rect x="292" y="80" width="78" height="52" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="331" y="112" font-size="19" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">0</text><text x="331" y="148" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">11</text><rect x="376" y="80" width="78" height="52" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="415" y="112" font-size="19" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">0</text><text x="415" y="148" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">12</text><rect x="460" y="80" width="78" height="52" rx="8" fill="#ffe9c4" stroke="#e0a243" stroke-width="1.5"/><text x="499" y="112" font-size="19" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">1</text><text x="499" y="148" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">13</text><rect x="544" y="80" width="78" height="52" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="583" y="112" font-size="19" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">0</text><text x="583" y="148" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">14</text><rect x="628" y="80" width="78" height="52" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="667" y="112" font-size="19" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">0</text><text x="667" y="148" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">15</text><text x="40" y="196" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">第13位变为1。</text></g><text x="24" y="292" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">定位字节1的第5位，按0x04置1。</text><text x="24" y="316" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">为什么：或运算写入，其余位不受影响。</text><line x1="24" y1="328" x2="736" y2="328" stroke="#d5dfda"/></g></svg>