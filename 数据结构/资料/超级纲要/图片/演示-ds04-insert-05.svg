<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 382" width="640" height="382"><title>向量插入：后缀怎样整体后移</title><rect width="640" height="382" fill="#ffffff"/><text x="24" y="30" font-size="18" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">向量插入：后缀怎样整体后移</text><text x="616" y="30" font-size="13" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="end">第 5 / 5 步</text><g transform="translate(0,46)"><text x="24" y="24" font-size="17" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">5. 完成</text><g transform="translate(0,36)"><text x="60" y="30" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">insert(2, 'I')：把后缀[2,4)整体后移一位，再写入I</text><rect x="60" y="96" width="64" height="46" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="92.0" y="125" font-size="18" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">D</text><text x="92.0" y="158" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">0</text><rect x="126" y="96" width="64" height="46" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="158.0" y="125" font-size="18" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">A</text><text x="158.0" y="158" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">1</text><rect x="192" y="96" width="64" height="46" rx="8" fill="#d9eaf9" stroke="#6d9dd6" stroke-width="1.5"/><text x="224.0" y="125" font-size="18" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">I</text><text x="224.0" y="158" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">2</text><rect x="258" y="96" width="64" height="46" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="290.0" y="125" font-size="18" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">T</text><text x="290.0" y="158" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">3</text><rect x="324" y="96" width="64" height="46" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="356.0" y="125" font-size="18" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">A</text><text x="356.0" y="158" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">4</text><text x="60" y="176" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">insert(2,'I')完成。</text><text x="60" y="204" font-size="14" fill="#5c6f68" font-family="Menlo, Consolas, monospace" text-anchor="start">_size = 4 → 5；容量足够，无需扩容</text></g><text x="24" y="292" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">向量变为D A I T A，规模加一。</text><text x="24" y="316" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">为什么：与教材表2.2第15行一致。</text><line x1="24" y1="328" x2="616" y2="328" stroke="#d5dfda"/></g></svg>