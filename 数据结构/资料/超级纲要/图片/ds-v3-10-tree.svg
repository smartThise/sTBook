<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="855" viewBox="0 0 1000 855"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#56748c"/></marker></defs><rect width="100%" height="100%" fill="#fafcfe"/><g font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif"><text x="24" y="42" font-size="25" fill="#172c40" text-anchor="start">同一棵树：左/右位置固定，输出顺序由访问时机决定</text><line x1="500" y1="125" x2="280" y2="200" stroke="#58758d" stroke-width="3"/><line x1="500" y1="125" x2="720" y2="200" stroke="#58758d" stroke-width="3"/><line x1="280" y1="245" x2="160" y2="320" stroke="#58758d" stroke-width="3"/><line x1="280" y1="245" x2="400" y2="320" stroke="#58758d" stroke-width="3"/><line x1="720" y1="245" x2="840" y2="320" stroke="#58758d" stroke-width="3"/><circle cx="500" cy="105" r="29" fill="#e3f0fb" stroke="#287ba6" stroke-width="2"/><text x="500" y="113" font-size="25" fill="#172c40" text-anchor="middle">A</text><circle cx="280" cy="225" r="29" fill="#e3f0fb" stroke="#287ba6" stroke-width="2"/><text x="280" y="233" font-size="25" fill="#172c40" text-anchor="middle">B</text><circle cx="720" cy="225" r="29" fill="#e3f0fb" stroke="#287ba6" stroke-width="2"/><text x="720" y="233" font-size="25" fill="#172c40" text-anchor="middle">C</text><circle cx="160" cy="345" r="29" fill="#e3f0fb" stroke="#287ba6" stroke-width="2"/><text x="160" y="353" font-size="25" fill="#172c40" text-anchor="middle">D</text><circle cx="400" cy="345" r="29" fill="#e3f0fb" stroke="#287ba6" stroke-width="2"/><text x="400" y="353" font-size="25" fill="#172c40" text-anchor="middle">E</text><circle cx="840" cy="345" r="29" fill="#e3f0fb" stroke="#287ba6" stroke-width="2"/><text x="840" y="353" font-size="25" fill="#172c40" text-anchor="middle">F</text><text x="260" y="430" font-size="24" fill="#172c40" text-anchor="start">先序：A B D E C F（根、左、右）</text><text x="260" y="480" font-size="24" fill="#172c40" text-anchor="start">中序：D B E A