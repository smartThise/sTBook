<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 362" width="720" height="362"><title>轮转调度：出队、服务、再入队</title><rect width="720" height="362" fill="#ffffff"/><text x="24" y="30" font-size="18" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">轮转调度：出队、服务、再入队</text><text x="696" y="30" font-size="13" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="end">第 6 / 6 步</text><g transform="translate(0,46)"><text x="24" y="24" font-size="17" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">6. 公平性</text><g transform="translate(0,36)"><text x="60" y="30" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">轮转调度第3轮：队首出队→接受一个时间片→重新入队</text><rect x="60" y="110" width="92" height="52" rx="10" fill="#ffe9c4" stroke="#e0a243" stroke-width="1.5"/><text x="106.0" y="136" font-size="18" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">C</text><text x="106.0" y="102" font-size="12" fill="#e0a243" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="middle">队首→出队</text><rect x="158" y="110" width="92" height="52" rx="10" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="204.0" y="136" font-size="18" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">D</text><rect x="256" y="110" width="92" height="52" rx="10" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="302.0" y="136" font-size="18" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">A</text><rect x="354" y="110" width="92" height="52" rx="10" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="400.0" y="136" font-size="18" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">B</text><text x="60" y="196" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">队列回到循环平移后的状态。</text></g><text x="24" y="272" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">每轮循环后队列循环左移一格：没有客户会被饿死。</text><text x="24" y="296" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">为什么：FIFO次序即公平次序；CPU、打印机等共享资源皆用此法。</text><line x1="24" y1="308" x2="696" y2="308" stroke="#d5dfda"/></g></svg>