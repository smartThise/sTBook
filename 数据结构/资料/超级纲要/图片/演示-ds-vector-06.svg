<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440"><title>向量扩容：旧数组与新数组同时出现</title><rect width="800" height="440" fill="#ffffff"/><text x="20" y="28" font-size="19" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">向量扩容：旧数组与新数组同时出现</text><g transform="translate(0,45)"><text x="20" y="26" font-size="20" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">6. 搬移一个已有元素</text><g transform="translate(0,48)"><text x="20" y="62" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">旧数组</text><rect x="140" y="35" width="79" height="42" rx="3" fill="#f5f8f6" stroke="#c6d2cc"></rect><text x="150" y="63" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">10</text><text x="150" y="95" font-size="12" fill="#596c64" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">0</text><rect x="222" y="35" width="79" height="42" rx="3" fill="#ffe2b6" stroke="#c6d2cc"></rect><text x="232" y="63" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">20</text><text x="232" y="95" font-size="12" fill="#596c64" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">1</text><text x="20" y="162" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">新数组</text><rect x="140" y="135" width="79" height="42" rx="3" fill="#f5f8f6" stroke="#c6d2cc"></rect><text x="150" y="163" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">10</text><text x="150" y="195" font-size="12" fill="#596c64" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">0</text><rect x="222" y="135" width="79" height="42" rx="3" fill="#ffe2b6" stroke="#c6d2cc"></rect><text x="232" y="163" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">20</text><text x="232" y="195" font-size="12" fill="#596c64" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">1</text><rect x="304" y="135" width="79" height="42" rx="3" fill="#f5f8f6" stroke="#c6d2cc"></rect><text x="314" y="163" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">空</text><text x="314" y="195" font-size="12" fill="#596c64" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">2</text><rect x="386" y="135" width="79" height="42" rx="3" fill="#f5f8f6" stroke="#c6d2cc"></rect><text x="396" y="163" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">空</text><text x="396" y="195" font-size="12" fill="#596c64" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">3</text></g><text x="20" y="303" font-size="16" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">new[1]←old[1]=20。</text><text x="20" y="328" font-size="16" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">原因：必须保留已有元素的先后顺序；此时两个数组暂时同时存在。</text><line x1="20" y1="363" x2="780" y2="363" stroke="#c6d2cc"></line></g></svg>
