<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 442" width="780" height="442"><title>直方图最大矩形：单调栈结算</title><rect width="780" height="442" fill="#ffffff"/><text x="24" y="30" font-size="18" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">直方图最大矩形：单调栈结算</text><text x="756" y="30" font-size="13" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="end">第 10 / 12 步</text><g transform="translate(0,46)"><text x="24" y="24" font-size="17" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">10. h[4]=1入栈</text><g transform="translate(0,36)"><text x="40" y="30" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">单调栈求最大矩形：栈内高度自底向顶严格递增</text><rect x="40" y="210" width="90" height="36" rx="4" fill="#d9f0e2" stroke="#d9e2dd" stroke-width="1.5"/><text x="85.0" y="262" font-size="15" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">2</text><text x="85.0" y="280" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">0</text><rect x="142" y="228" width="90" height="18" rx="4" fill="#d9f0e2" stroke="#d9e2dd" stroke-width="1.5"/><text x="187.0" y="262" font-size="15" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">1</text><text x="187.0" y="280" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">1</text><rect x="244" y="174" width="90" height="72" rx="4" fill="#d9f0e2" stroke="#d9e2dd" stroke-width="1.5"/><text x="289.0" y="262" font-size="15" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">4</text><text x="289.0" y="280" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">2</text><rect x="346" y="156" width="90" height="90" rx="4" fill="#d9f0e2" stroke="#d9e2dd" stroke-width="1.5"/><text x="391.0" y="262" font-size="15" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">5</text><text x="391.0" y="280" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">3</text><rect x="448" y="228" width="90" height="18" rx="4" fill="#ffe9c4" stroke="#e0a243" stroke-width="1.5"/><text x="493.0" y="262" font-size="15" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">1</text><text x="493.0" y="280" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">4</text><text x="40" y="216" font-size="14" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="start">栈（自底→顶）：r4(h1)</text><text x="40" y="266" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">r4入栈。</text></g><text x="24" y="352" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">H[4]高于栈顶，直接入栈。</text><text x="24" y="376" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">为什么：保持栈内高度严格递增。</text><line x1="24" y1="388" x2="756" y2="388" stroke="#d5dfda"/></g></svg>