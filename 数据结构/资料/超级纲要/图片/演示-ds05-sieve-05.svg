or="middle">24</text><rect x="270" y="176" width="72" height="44" rx="8" fill="#fbe4e4" stroke="#d89393" stroke-width="1.5"/><text x="306.0" y="204" font-size="16" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">25</text><rect x="350" y="176" width="72" height="44" rx="8" fill="#fbe4e4" stroke="#d89393" stroke-width="1.5"/><text x="386.0" y="204" font-size="16" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">26</text><rect x="430" y="176" width="72" height="44" rx="8" fill="#fbe4e4" stroke="#d89393" stroke-width="1.5"/><text x="466.0" y="204" font-size="16" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">27</text><rect x="510" y="176" width="72" height="44" rx="8" fill="#fbe4e4" stroke="#d89393" stroke-width="1.5"/><text x="546.0" y="204" font-size="16" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">28</text><rect x="590" y="176" width="72" height="44" rx="8" fill="#d9f0e2" stroke="#6cb98d" stroke-width="1.5"/><text x="626.0" y="204" font-size="16" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">29</text><text x="24" y="250" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">7²=49&gt;30，筛法终止。</text><rect x="24" y="268" width="120" height="24" rx="8" fill="#d9f0e2" stroke="#6cb98d" stroke-width="1.5"/><text x="84.0" y="284.68" font-size="13" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="middle">质数</text><rect x="154" y="268" width="120" height="24" rx="8" fill="#fbe4e4" stroke="#d89393" stroke-width="1.5"/><text x="214.0" y="284.68" font-size="13" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="middle">合数</text><rect x="284" y="268" width="130" height="24" rx="8" fill="#ffe9c4" stroke="#e0a243" stroke-width="1.5"/><text x="349.0" y="284.68" font-size="13" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="middle">本轮清除</text></g><text x="24" y="382" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">7²=49>30，筛法终止。</text><text x="24" y="406" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">为什么：小于p²的合数必含更小质因子，已被更早的轮次清除。</text><line x1="24" y1="418" x2="876" y2="418" stroke="#d5dfda"/></g></svg>