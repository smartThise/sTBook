<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 442" width="740" height="442"><title>kd树：平面交替二分</title><rect width="740" height="442" fill="#ffffff"/><text x="24" y="30" font-size="18" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">kd树：平面交替二分</text><text x="716" y="30" font-size="13" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="end">第 3 / 4 步</text><g transform="translate(0,46)"><text x="24" y="24" font-size="17" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">3. 第3层：右半按y轴划分</text><g transform="translate(0,36)"><text x="40" y="30" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">kd树：交替按x、y轴二分平面（左闭右开）</text><line x1="150" y1="60" x2="150" y2="250" stroke="#6d9dd6" stroke-width="2"/><line x1="60" y1="150" x2="148" y2="150" stroke="#6cb98d" stroke-width="2"/><line x1="152" y1="200" x2="290" y2="200" stroke="#6cb98d" stroke-width="2"/><circle cx="90" cy="150" r="8" fill="#d9eaf9" stroke="#6d9dd6" stroke-width="1.5"/><text x="104" y="142" font-size="15" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="start">A</text><circle cx="200" cy="90" r="8" fill="#d9eaf9" stroke="#6d9dd6" stroke-width="1.5"/><text x="214" y="82" font-size="15" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="start">B</text><circle cx="150" cy="220" r="8" fill="#d9eaf9" stroke="#6d9dd6" stroke-width="1.5"/><text x="164" y="212" font-size="15" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="start">C</text><circle cx="260" cy="200" r="8" fill="#ffe9c4" stroke="#e0a243" stroke-width="1.5"/><text x="274" y="192" font-size="15" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="start">D</text><text x="40" y="272" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">递归完成：四点四叶。</text></g><text x="24" y="352" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">右半{C, D}：y中位数为D.y=200，画横线。</text><text x="24" y="376" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">为什么：递归直至每区至多1点，成为叶子。</text><line x1="24" y1="388" x2="716" y2="388" stroke="#d5dfda"/></g></svg>