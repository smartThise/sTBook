<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 422" width="700" height="422"><title>进制转换：2026怎样变成3752(8)</title><rect width="700" height="422" fill="#ffffff"/><text x="24" y="30" font-size="18" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">进制转换：2026怎样变成3752(8)</text><text x="676" y="30" font-size="13" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="end">第 6 / 10 步</text><g transform="translate(0,46)"><text x="24" y="24" font-size="17" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">6. pop '3'</text><g transform="translate(0,36)"><text x="60" y="30" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">convert(2026, 8)：反复模余入栈、除商更新；再整体弹出</text><text x="60" y="58" font-size="14" fill="#5c6f68" font-family="Menlo, Consolas, monospace" text-anchor="start">2026 ÷ 8 = 253 … 2；253 ÷ 8 = 31 … 5；31 ÷ 8 = 3 … 7；3 ÷ 8 = 0 … 3</text><rect x="440" y="120" width="66" height="48" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="473.0" y="150" font-size="18" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">2</text><rect x="440" y="176" width="66" height="48" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="473.0" y="206" font-size="18" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">5</text><rect x="440" y="232" width="66" height="48" rx="8" fill="#d9eaf9" stroke="#d9e2dd" stroke-width="1.5"/><text x="473.0" y="262" font-size="18" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">7</text><text x="518" y="262" font-size="13" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="start">← 栈顶</text><text x="60" y="96" font-size="16" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="start">输出（自高到低）：3</text><text x="60" y="250" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">已输出 3。</text></g><text x="24" y="332" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">弹出栈顶'3'，作为当前最高位输出。</text><text x="24" y="356" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">为什么：栈的LIFO恰好把低位次序反转为高位次序。</text><line x1="24" y1="368" x2="676" y2="368" stroke="#d5dfda"/></g></svg>