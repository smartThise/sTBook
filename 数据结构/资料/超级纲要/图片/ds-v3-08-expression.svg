<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#56748c"/></marker></defs><rect width="100%" height="100%" fill="#fafcfe"/><g font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif"><text x="24" y="42" font-size="26" fill="#172c40" text-anchor="start">3*(2+4)：O等运算，V存值；都从底写到顶</text><text x="24" y="120" font-size="21" fill="#172c40" text-anchor="start">读3</text><rect x="320" y="85" width="285" height="50" rx="6" fill="#e3f0fb" stroke="#667c90" stroke-width="2"/><text x="335" y="119" font-size="22" fill="#172c40" text-anchor="start">O: 空</text><rect x="635" y="85" width="320" height="50" rx="6" fill="#d4efdf" stroke="#667c90" stroke-width="2"/><text x="650" y="119" font-size="22" fill="#172c40" text-anchor="start">V: 3</text><text x="24" y="195" font-size="21" fill="#172c40" text-anchor="start">读*</text><rect x="320" y="160" width="285" height="50" rx="6" fill="#e3f0fb" stroke="#667c90" stroke-width="2"/><text x="335" y="194" font-size="22" fill="#172c40" text-anchor="start">O: *</text><rect x="635" y="160" width="320" height="50" rx="6" fill="#d4efdf" stroke="#667c90" stroke-width="2"/><text x="650" y="194" font-size="22" fill="#172c40" text-anchor="start">V: 3</text><text x="24" y="270" font-size="21" fill="#172c40" text-anchor="start">读(</text><rect x="320" y="235" width="285" height="50" rx="6" fill="#e3f0fb" stroke="#667c90" stroke-width="2"/><text x="335" y="269" font-size="22" fill="#172c40" text-anchor="start">O: * , (</text><rect x="635" y="235" width="320" height="50" rx="6" fill="#d4efdf" stroke="#667c90" stroke-width="2"/><text x="650" y="269" font-size="22" fill="#172c40" text-anchor="start">V: 3</text><text x="24" y="345" font-size="21" fill="#172c40" text-anchor="start">读2</text><rect x="320" y="310" width="285" height="50" rx="6" fill="#e3f0fb" stroke="#667c90" stroke-width="2"/><text x="33