<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 465" width="800" height="465"><title>KMP：失败时保留已经匹配的字符</title><rect width="800" height="465" fill="#ffffff"/><text x="20" y="28" font-size="19" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">KMP：失败时保留已经匹配的字符</text><g transform="translate(0,45)"><text x="20" y="26" font-size="20" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">12. 只退模式位置，文本不回退</text><g transform="translate(0,48)"><text x="20" y="25" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">i=5，j=3，模式起点对齐文本下标 i−j=2</text><text x="20" y="92" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">文本 T</text><rect x="140" y="65" width="67" height="42" rx="3" fill="#f5f8f6" stroke="#c6d2cc"></rect><text x="150" y="93" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">A</text><text x="150" y="125" font-size="12" fill="#596c64" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">0</text><rect x="210" y="65" width="67" height="42" rx="3" fill="#f5f8f6" stroke="#c6d2cc"></rect><text x="220" y="93" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">B</text><text x="220" y="125" font-size="12" fill="#596c64" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">1</text><rect x="280" y="65" width="67" height="42" rx="3" fill="#d7eee3" stroke="#c6d2cc"></rect><text x="290" y="93" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">A</text><text x="290" y="125" font-size="12" fill="#596c64" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">2</text><rect x="350" y="65" width="67" height="42" rx="3" fill="#d7eee3" stroke="#c6d2cc"></rect><text x="360" y="93" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">B</text><text x="360" y="125" font-size="12" fill="#596c64" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">3</text><rect x="420" y="65" width="67" height="42" rx="3" fill="#d7eee3" stroke="#c6d2cc"></rect><text x="430" y="93" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">A</text><text x="430" y="125" font-size="12" fill="#596c64" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">4</text><rect x="490" y="65" width="67" height="42" rx="3" fill="#ffe2b6" stroke="#c6d2cc"></rect><text x="500" y="93" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">B</text><text x="500" y="125" font-size="12" fill="#596c64" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">5</text><rect x="560" y="65" width="67" height="42" rx="3" fill="#f5f8f6" stroke="#c6d2cc"></rect><text x="570" y="93" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">A</text><text x="570" y="125" font-size="12" fill="#596c64" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">6</text><rect x="630" y="65" width="67" height="42" rx="3" fill="#f5f8f6" stroke="#c6d2cc"></rect><text x="640" y="93" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">C</text><text x="640" y="125" font-size="12" fill="#596c64" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">7</text><text x="20" y="192" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">模式 P</text><rect x="280" y="165" width="67" height="42" rx="3" fill="#d7eee3" stroke="#c6d2cc"></rect><text x="290" y="193" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">A</text><text x="290" y="225" font-size="12" fill="#596c64" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">0</text><rect x="350" y="165" width="67" height="42" rx="3" fill="#d7eee3" stroke="#c6d2cc"></rect><text x="360" y="193" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">B</text><text x="360" y="225" font-size="12" fill="#596c64" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">1</text><rect x="420" y="165" width="67" height="42" rx="3" fill="#d7eee3" stroke="#c6d2cc"></rect><text x="430" y="193" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">A</text><text x="430" y="225" font-size="12" fill="#596c64" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">2</text><rect x="490" y="165" width="67" height="42" rx="3" fill="#ffe2b6" stroke="#c6d2cc"></rect><text x="500" y="193" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">B</text><text x="500" y="225" font-size="12" fill="#596c64" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">3</text><rect x="560" y="165" width="67" height="42" rx="3" fill="#f5f8f6" stroke="#c6d2cc"></rect><text x="570" y="193" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">A</text><text x="570" y="225" font-size="12" fill="#596c64" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">4</text><rect x="630" y="165" width="67" height="42" rx="3" fill="#f5f8f6" stroke="#c6d2cc"></rect><text x="640" y="193" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">C</text><text x="640" y="225" font-size="12" fill="#596c64" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">5</text></g><text x="20" y="328" font-size="16" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">j←π[4]=3；i仍为5；模式向右移动2格。</text><text x="20" y="353" font-size="16" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">原因：已匹配的ABABA有最长相同真前后缀ABA，长度3；这3个字符可以直接保留。</text><line x1="20" y1="388" x2="780" y2="388" stroke="#c6d2cc"></line></g></svg>
