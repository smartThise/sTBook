<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 338" width="780" height="338"><title>起泡排序：一趟扫描怎样把7推到末尾</title><rect width="780" height="338" fill="#ffffff"/><text x="24" y="30" font-size="18" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">起泡排序：一趟扫描怎样把7推到末尾</text><text x="756" y="30" font-size="13" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="end">第 12 / 13 步</text><g transform="translate(0,46)"><text x="24" y="24" font-size="17" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">12. 交换完成：7占住a[6]</text><g transform="translate(0,36)"><text x="50" y="30" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">第1趟：自左向右逐对检视，逆序即交换</text><rect x="50" y="86" width="58" height="44" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="79.0" y="114.0" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">2</text><text x="79.0" y="146" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">0</text><rect x="110" y="86" width="58" height="44" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="139.0" y="114.0" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">5</text><text x="139.0" y="146" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">1</text><rect x="170" y="86" width="58" height="44" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="199.0" y="114.0" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">4</text><text x="199.0" y="146" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">2</text><rect x="230" y="86" width="58" height="44" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="259.0" y="114.0" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">6</text><text x="259.0" y="146" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">3</text><rect x="290" y="86" width="58" height="44" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="319.0" y="114.0" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">3</text><text x="319.0" y="146" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">4</text><rect x="350" y="86" width="58" height="44" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="379.0" y="114.0" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">1</text><text x="379.0" y="146" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">5</text><rect x="410" y="86" width="58" height="44" rx="8" fill="#d9eaf9" stroke="#6d9dd6" stroke-width="1.5"/><text x="439.0" y="114.0" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">7</text><text x="439.0" y="146" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">6</text></g><text x="24" y="248" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">较大者继续留在扫描前沿。</text><text x="24" y="272" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">为什么：较大者始终骑在扫描线上，一路向右。</text><line x1="24" y1="284" x2="756" y2="284" stroke="#d5dfda"/></g></svg>