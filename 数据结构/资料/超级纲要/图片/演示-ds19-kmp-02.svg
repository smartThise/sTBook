<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 372" width="760" height="372"><title>KMP next表：MAMMIA逐步构造</title><rect width="760" height="372" fill="#ffffff"/><text x="24" y="30" font-size="18" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">KMP next表：MAMMIA逐步构造</text><text x="736" y="30" font-size="13" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="end">第 2 / 5 步</text><g transform="translate(0,46)"><text x="24" y="24" font-size="17" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">2. j=3，t=0：P[2]=M=P[0]命中</text><g transform="translate(0,36)"><text x="40" y="30" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">next表构造（模式P=MAMMIA）：当前算到j=3，t=1</text><rect x="40" y="80" width="66" height="46" rx="8" fill="#d9eaf9" stroke="#6d9dd6" stroke-width="1.5"/><text x="73" y="109" font-size="18" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">M</text><text x="73" y="142" font-size="12" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">next[0]=-1</text><rect x="114" y="80" width="66" height="46" rx="8" fill="#d9eaf9" stroke="#6d9dd6" stroke-width="1.5"/><text x="147" y="109" font-size="18" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">A</text><text x="147" y="142" font-size="12" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">next[1]=0</text><rect x="188" y="80" width="66" height="46" rx="8" fill="#ffe9c4" stroke="#e0a243" stroke-width="1.5"/><text x="221" y="109" font-size="18" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">M</text><text x="221" y="142" font-size="12" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">next[2]=0</text><rect x="262" y="80" width="66" height="46" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="295" y="109" font-size="18" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">M</text><text x="295" y="142" font-size="12" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">next[3]=1</text><rect x="336" y="80" width="66" height="46" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="369" y="109" font-size="18" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">I</text><text x="369" y="142" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">next[4]=1</text><rect x="410" y="80" width="66" height="46" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="443" y="109" font-size="18" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">A</text><text x="443" y="142" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">next[5]=0</text><text x="40" y="200" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">next[3]=1。</text></g><text x="24" y="282" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">t增至1，next[3]=1。</text><text x="24" y="306" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">为什么：前缀M已自匹配到位置2。</text><line x1="24" y1="318" x2="736" y2="318" stroke="#d5dfda"/></g></svg>