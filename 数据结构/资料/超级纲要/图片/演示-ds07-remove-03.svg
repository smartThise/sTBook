<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 442" width="720" height="442"><title>删除节点：让两侧指针绕过它</title><rect width="720" height="442" fill="#ffffff"/><text x="24" y="30" font-size="18" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">删除节点：让两侧指针绕过它</text><text x="696" y="30" font-size="13" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="end">第 3 / 3 步</text><g transform="translate(0,46)"><text x="24" y="24" font-size="17" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">3. 第二根：p-&gt;succ-&gt;pred = p-&gt;pred</text><g transform="translate(0,36)"><text x="40" y="30" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">remove(p)：让两侧指针绕过被删节点</text><rect x="40" y="150" width="120" height="54" rx="10" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="100.0" y="178" font-size="18" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">A</text><rect x="206" y="150" width="120" height="54" rx="10" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="266.0" y="178" font-size="18" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">C</text><line x1="100.0" y1="132" x2="266.0" y2="132" stroke="#6d9dd6" stroke-width="2.2"/><circle cx="266.0" cy="132" r="3" fill="#6d9dd6" stroke="none" stroke-width="1"/><text x="40" y="240" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">A → C，删除完成，O(1)。</text><text x="40" y="266" font-size="14" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">为什么：同样只是局部常数根指针，与表长无关。</text></g><text x="24" y="352" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">C的pred越过p改指A。</text><text x="24" y="376" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">为什么：反向链接通后，p彻底出链；delete释放节点，规模减一。</text><line x1="24" y1="388" x2="696" y2="388" stroke="#d5dfda"/></g></svg>