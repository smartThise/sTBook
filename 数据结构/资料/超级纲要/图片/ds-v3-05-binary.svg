<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="625" viewBox="0 0 1000 625"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#56748c"/></marker></defs><rect width="100%" height="100%" fill="#fafcfe"/><g font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif"><text x="24" y="42" font-size="25" fill="#172c40" text-anchor="start">lower_bound([1,3,3,7,9],3)：找第一个不小于3的位置</text><text x="24" y="128" font-size="22" fill="#172c40" text-anchor="start">lo=0, hi=5, mid=2</text><rect x="365" y="95" width="97" height="48" rx="6" fill="#fff" stroke="#667c90" stroke-width="2"/><text x="413.5" y="127" font-size="22" fill="#172c40" text-anchor="middle">1</text><rect x="470" y="95" width="97" height="48" rx="6" fill="#fff" stroke="#667c90" stroke-width="2"/><text x="518.5" y="127" font-size="22" fill="#172c40" text-anchor="middle">3</text><rect x="575" y="95" width="97" height="48" rx="6" fill="#fff" stroke="#dc7a26" stroke-width="2"/><text x="623.5" y="127" font-size="22" fill="#172c40" text-anchor="middle">3</text><rect x="680" y="95" width="97" height="48" rx="6" fill="#fff" stroke="#667c90" stroke-width="2"/><text x="728.5" y="127" font-size="22" fill="#172c40" text-anchor="middle">7</text><rect x="785" y="95" width="97" height="48" rx="6" fill="#fff" stroke="#667c90" stroke-width="2"/><text x="833.5" y="127" font-size="22" fill="#172c40" text-anchor="middle">9</text><text x="24" y="228" font-size="22" fill="#172c40" text-anchor="start">3不小于3  ->  hi=2</text><rect x="365" y="195" width="97" height="48" rx="6" fill="#fff" stroke="#667c90" stroke-width="2"/><text x="413.5" y="227" font-size="22" fill="#172c40" text-anchor="middle">1</text><rect x="470" y="195" width="97" height="48" rx="6" fill="#fff" stroke="#dc7a26" stroke-width="2"/><text x="518.5" y="227" font-size="22" fill="#172c40" text-anchor="middle">3</text><rect x="575" y="195" width="97" height="48" rx="6" fill="#d9eafa" stroke="#667c90" stroke-width="2"/><text x="623.5" y="227" font-size="22" fill="#172c40" text-anchor="middle">3</text><rect x="680" y="195" width="97" height="48" rx="6" fill="#d9eafa" stroke="#667c90" stroke-width="2"/><text x="728.5" y="227" font-size="22" fill="#172c40" text-anchor="middle">7</text><rect x="785" y="195" width="97" height="48" rx="6" fill="#d9eafa" stroke="#667c90" stroke-width="2"/><text x="833.5" y="227" font-size="22" fill="#172c40" text-anchor="middle">9</text><text x="24" y="328" font-size="22" fill="#172c40" text-anchor="start">3不小于3  ->  hi=1</text><rect x="365" y="295" width="97" height="48" rx="6" fill="#fff" stroke="#dc7a26" stroke-width="2"/><text x="413.5" y="327" font-size="22" fill="#172c40" text-anchor="middle">1</text><rect x="470" y="295" width="97" height="48" rx="6" fill="#d9eafa" stroke="#667c90" stroke-width="2"/><text x="518.5" y="327" font-size="22" fill="#172c40" text-anchor="middle">3</text><rect x="575" y="295" width="97" height="48" rx="6" fill="#d9eafa" stroke="#667c90" stroke-width="2"/><text x="623.5" y="327" font-size="22" fill="#172c40" text-anchor="middle">3</text><rect x="680" y="295" width="97" height="48" rx="6" fill="#d9eafa" stroke="#667c90" stroke-width="2"/><text x="728.5" y="327" font-size="22" fill="#172c40" text-anchor="middle">7</text><rect x="785" y="295" width="97" height="48" rx="6" fill="#d9eafa" stroke="#667c90" stroke-width="2"/><text x="833.5" y="327" font-size="22" fill="#172c40" text-anchor="middle">9</text><text x="24" y="428" font-size="22" fill="#172c40" text-anchor="start">1小于3  ->  lo=1</text><rect x="365" y="395" width="97" height="48" rx="6" fill="#d4efdf" stroke="#667c90" stroke-width="2"/><text x="413.5" y="427" font-size="22" fill="#172c40" text-anchor="middle">1</text><rect x="470" y="395" width="97" height="48" rx="6" fill="#d9eafa" stroke="#667c90" stroke-width="2"/><text x="518.5" y="427" font-size="22" fill="#172c40" text-anchor="middle">3</text><rect x="575" y="395" width="97" height="48" rx=