<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 354" width="720" height="354"><title>RAM上整除：25÷12的14步快照</title><rect width="720" height="354" fill="#ffffff"/><text x="24" y="30" font-size="18" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">RAM上整除：25÷12的14步快照</text><text x="696" y="30" font-size="13" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="end">第 7 / 15 步</text><g transform="translate(0,46)"><text x="24" y="24" font-size="17" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">7. 执行[4]</text><g transform="translate(0,36)"><text x="40" y="30" font-size="13" fill="#5c6f68" font-family="Menlo, Consolas, monospace" text-anchor="start">[0]R3←1  [1]GOTO4  [2]x++  [3]c-=d  [4]IF R0&gt;0 GOTO2  [5]R0←x  [6]STOP</text><rect x="40" y="92" width="150" height="54" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="115" y="114" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">R[0]</text><text x="115" y="137" font-size="19" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">13</text><rect x="200" y="92" width="150" height="54" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="275" y="114" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">R[1]</text><text x="275" y="137" font-size="19" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">12</text><rect x="360" y="92" width="150" height="54" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="435" y="114" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">R[2]</text><text x="435" y="137" font-size="19" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">1</text><rect x="520" y="92" width="150" height="54" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="595" y="114" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">R[3]</text><text x="595" y="137" font-size="19" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">1</text><text x="40" y="192" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">本步不写入任何寄存器。</text><text x="680" y="192" font-size="15" fill="#5c6f68" font-family="Menlo, Consolas, monospace" text-anchor="end">IR=[4]</text></g><text x="24" y="264" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">13 > 0 成立，转[2]。</text><text x="24" y="288" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">为什么：还不够，继续。</text><line x1="24" y1="300" x2="696" y2="300" stroke="#d5dfda"/></g></svg>