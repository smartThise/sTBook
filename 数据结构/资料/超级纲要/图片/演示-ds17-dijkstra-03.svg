<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 412" width="780" height="412"><title>Dijkstra：S/A/B/C的松弛过程</title><rect width="780" height="412" fill="#ffffff"/><text x="24" y="30" font-size="18" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">Dijkstra：S/A/B/C的松弛过程</text><text x="756" y="30" font-size="13" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="end">第 3 / 5 步</text><g transform="translate(0,46)"><text x="24" y="24" font-size="17" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">3. 取出B（dist=3），松弛</text><g transform="translate(0,36)"><text x="40" y="30" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">Dijkstra：每步取出dist最小且未定的顶点，松弛其邻居</text><text x="40" y="58" font-size="15" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="start">dist: S=0  A=7  B=3  C=11</text><text x="40" y="84" font-size="15" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="start">已确定: S B</text><rect x="500" y="44" width="200" height="26" rx="8" fill="#ffe9c4" stroke="#e0a243" stroke-width="1.5"/><text x="600.0" y="62.04" font-size="14" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">取出 B</text><text x="40" y="214" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">A:3+4=7；C:3+8=11</text></g><text x="24" y="322" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">B确定为3。松弛A：min(10, 3+4)=7改进；C：3+8=11。</text><text x="24" y="346" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">为什么：经B绕行更短，A的候选值从10降到7。</text><line x1="24" y1="358" x2="756" y2="358" stroke="#d5dfda"/></g></svg>