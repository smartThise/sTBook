<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 442" width="720" height="442"><title>AVL双旋：LR失衡与复衡</title><rect width="720" height="442" fill="#ffffff"/><text x="24" y="30" font-size="18" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">AVL双旋：LR失衡与复衡</text><text x="696" y="30" font-size="13" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="end">第 2 / 4 步</text><g transform="translate(0,46)"><text x="24" y="24" font-size="17" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">2. insert(4)引发失衡。</text><g transform="translate(0,36)"><text x="40" y="30" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">insert(4)引发失衡。</text><line x1="360" y1="116" x2="220" y2="182" stroke="#d5dfda" stroke-width="2"/><line x1="220" y1="216" x2="290" y2="182" stroke="#d5dfda" stroke-width="2"/><rect x="324" y="84" width="72" height="44" rx="10" fill="#fbe4e4" stroke="#d89393" stroke-width="1.5"/><text x="360" y="110" font-size="18" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">5</text><rect x="184" y="184" width="72" height="44" rx="10" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="220" y="210" font-size="18" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">3</text><rect x="254" y="184" width="72" height="44" rx="10" fill="#d9eaf9" stroke="#6d9dd6" stroke-width="1.5"/><text x="290" y="210" font-size="18" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">4</text><text x="40" y="266" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">插入4：落在3的右侧。g=5的balFac升到+2，失衡；p=3（较高孩子），v=4（p的较高孩子）。</text><text x="40" y="290" font-size="14" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">为什么：p与v异侧：LR型失衡，需双旋。</text></g><text x="24" y="352" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">插入4：落在3的右侧。g=5的balFac升到+2，失衡；p=3（较高孩子），v=4（p的较高孩子）。</text><text x="24" y="376" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">为什么：p与v异侧：LR型失衡，需双旋。</text><line x1="24" y1="388" x2="696" y2="388" stroke="#d5dfda"/></g></svg>