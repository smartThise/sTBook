<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 392" width="700" height="392"><title>栈混洗甄别：[3,1,2]为什么卡住</title><rect width="700" height="392" fill="#ffffff"/><text x="24" y="30" font-size="18" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">栈混洗甄别：[3,1,2]为什么卡住</text><text x="676" y="30" font-size="13" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="end">第 3 / 4 步</text><g transform="translate(0,46)"><text x="24" y="24" font-size="17" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">3. B操作：弹出3</text><g transform="translate(0,36)"><text x="56" y="30" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">spCheck([3,1,2])：A输入栈只记栈顶；S为中转栈；逐项尝试B操作</text><text x="56" y="58" font-size="15" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="start">A输入栈顶：已空　　目标序列B：3 1 2　　已核对到第1项</text><rect x="356" y="120" width="110" height="48" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="411" y="150" font-size="18" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">1</text><rect x="356" y="176" width="110" height="48" rx="8" fill="#ffe9c4" stroke="#d9e2dd" stroke-width="1.5"/><text x="411" y="206" font-size="18" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">2</text><text x="476" y="206" font-size="13" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="start">← 栈顶</text><text x="56" y="216" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">已核对3。</text></g><text x="24" y="302" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">S弹出3，与B[0]核对成功；r=1。</text><text x="24" y="326" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">为什么：3是最后压入的，最先弹出——符合LIFO。</text><line x1="24" y1="338" x2="676" y2="338" stroke="#d5dfda"/></g></svg>