<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 575" width="800" height="575"><title>3×(2+4)：两只栈怎样求值</title><rect width="800" height="575" fill="#ffffff"/><text x="20" y="28" font-size="19" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">3×(2+4)：两只栈怎样求值</text><g transform="translate(0,45)"><text x="20" y="26" font-size="20" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">11. 把计算结果6压回</text><g transform="translate(0,48)"><text x="20" y="25" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">输入：3 * ( 2 + 4 ) #；当前读取 )</text><text x="20" y="92" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">数栈：底→顶</text><rect x="140" y="65" width="79" height="42" rx="3" fill="#f5f8f6" stroke="#c6d2cc"></rect><text x="150" y="93" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">3</text><text x="150" y="125" font-size="12" fill="#596c64" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">0</text><rect x="222" y="65" width="79" height="42" rx="3" fill="#f5f8f6" stroke="#c6d2cc"></rect><text x="232" y="93" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">6</text><text x="232" y="125" font-size="12" fill="#596c64" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">1</text><text x="20" y="192" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">符号栈：底→顶</text><rect x="140" y="165" width="79" height="42" rx="3" fill="#f5f8f6" stroke="#c6d2cc"></rect><text x="150" y="193" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">#</text><text x="150" y="225" font-size="12" fill="#596c64" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">0</text><rect x="222" y="165" width="79" height="42" rx="3" fill="#f5f8f6" stroke="#c6d2cc"></rect><text x="232" y="193" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">*</text><text x="232" y="225" font-size="12" fill="#596c64" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">1</text><rect x="304" y="165" width="79" height="42" rx="3" fill="#f5f8f6" stroke="#c6d2cc"></rect><text x="314" y="193" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">(</text><text x="314" y="225" font-size="12" fill="#596c64" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">2</text><text x="20" y="292" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">弹出后：左/右</text><rect x="140" y="265" width="79" height="42" rx="3" fill="#f5f8f6" stroke="#c6d2cc"></rect><text x="150" y="293" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">未取</text><text x="150" y="325" font-size="12" fill="#596c64" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">0</text><rect x="222" y="265" width="79" height="42" rx="3" fill="#f5f8f6" stroke="#c6d2cc"></rect><text x="232" y="293" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">未取</text><text x="232" y="325" font-size="12" fill="#596c64" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">1</text></g><text x="20" y="438" font-size="16" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">2+4=6，右括号仍未消耗。</text><text x="20" y="463" font-size="16" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">原因：一个子表达式归约成一个数，供外层运算使用。</text><line x1="20" y1="498" x2="780" y2="498" stroke="#c6d2cc"></line></g></svg>
