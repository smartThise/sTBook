<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="385" viewBox="0 0 1100 385">
<rect width="1100" height="385" fill="#fff"/>
<style>text{font-family:Arial, 'PingFang SC', 'Noto Sans CJK SC', sans-serif;fill:#172334}.title{font-size:25px;font-weight:600}.note{font-size:16px;fill:#68778b}</style>
<text x="28" y="35" class="title">删除30后下溢，再从左兄弟借位</text>
<text x="28" y="65" class="note">教师事后修复版：(a,b)=(2,4)，非根页1–3键；4键或0键是待修复暂态</text>
<text x="185" y="112" text-anchor="middle" style="font-size:19px">1  删前合法</text>
<line x1="185" y1="200" x2="97" y2="255" stroke="#8090a3" stroke-width="2.2"/>
<line x1="185" y1="200" x2="273" y2="255" stroke="#8090a3" stroke-width="2.2"/>
<rect x="150.0" y="150" width="70" height="50" rx="8" fill="#f4f8ff" stroke="#2563eb" stroke-width="2.5"/><text x="185" y="183" text-anchor="middle" style="font-size:23px;fill:#2563eb">20</text>
<rect x="41.0" y="255" width="112" height="50" rx="8" fill="#f4f8ff" stroke="#2563eb" stroke-width="2.5"/><text x="97" y="288" text-anchor="middle" style="font-size:23px;fill:#2563eb">5 | 10</text>
<rect x="238.0" y="255" width="70" height="50" rx="8" fill="#f4f8ff" stroke="#2563eb" stroke-width="2.5"/><text x="273" y="288" text-anchor="middle" style="font-size:23px;fill:#2563eb">30</text>
<text x="550" y="112" text-anchor="middle" style="font-size:19px">2  删除30，右页变空</text>
<line x1="550" y1="200" x2="462" y2="255" stroke="#8090a3" stroke-width="2.2"/>
<line x1="550" y1="200" x2="638" y2="255" stroke="#8090a3" stroke-width="2.2"/>
<rect x="515.0" y="150" width="70" height="50" rx="8" fill="#f4f8ff" stroke="#2563eb" stroke-width="2.5"/><text x="550" y="183" text-anchor="middle" style="font-size:23px;fill:#2563eb">20</text>
<rect x="406.0" y="255" width="112" height="50" rx="8" fill="#f4f8ff" stroke="#2563eb" stroke-width="2.5"/><text x="462" y="288" text-anchor="middle" style="font-size:23px;fill:#2563eb">5 | 10</text>
<rect x="603.0" y="255" width="70" height="50" rx="8" fill="#f4f8ff" stroke="#b91c1c" stroke-width="2.5"/><text x="638" y="288" text-anchor="middle" style="font-size:23px;fill:#b91c1c">空页</text>
<text x="915" y="112" text-anchor="middle" style="font-size:19px">3  修复完成</text>
<line x1="915" y1="200" x2="827" y2="255" stroke="#8090a3" stroke-width="2.2"/>
<line x1="915" y1="200" x2="1003" y2="255" stroke="#8090a3" stroke-width="2.2"/>
<rect x="880.0" y="150" width="70" height="50" rx="8" fill="#f4f8ff" stroke="#0f766e" stroke-width="2.5"/><text x="915" y="183" text-anchor="middle" style="font-size:23px;fill:#0f766e">10</text>
<rect x="792.0" y="255" width="70" height="50" rx="8" fill="#f4f8ff" stroke="#2563eb" stroke-width="2.5"/><text x="827" y="288" text-anchor="middle" style="font-size:23px;fill:#2563eb">5</text>
<rect x="968.0" y="255" width="70" height="50" rx="8" fill="#f4f8ff" stroke="#0f766e" stroke-width="2.5"/><text x="1003" y="288" text-anchor="middle" style="font-size:23px;fill:#0f766e">20</text>
<text x="150" y="350" class="note">父20降入空右页；左页最大键10升为父分隔键。最终5 &lt; 10 &lt; 20。</text>
</svg>