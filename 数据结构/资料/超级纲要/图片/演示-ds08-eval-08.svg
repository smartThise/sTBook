<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 402" width="720" height="402"><title>表达式求值：1+2*3的两栈协作</title><rect width="720" height="402" fill="#ffffff"/><text x="24" y="30" font-size="18" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">表达式求值：1+2*3的两栈协作</text><text x="696" y="30" font-size="13" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="end">第 8 / 9 步</text><g transform="translate(0,46)"><text x="24" y="24" font-size="17" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">8. 执行+</text><g transform="translate(0,36)"><text x="50" y="30" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">evaluate('1 + 2 * 3')：数栈opnd、符栈optr；读入字符i=5</text><rect x="50" y="120" width="88" height="42" rx="8" fill="#d9f0e2" stroke="#6cb98d" stroke-width="1.5"/><text x="94" y="147" font-size="18" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">1</text><rect x="146" y="120" width="88" height="42" rx="8" fill="#d9f0e2" stroke="#6cb98d" stroke-width="1.5"/><text x="190" y="147" font-size="18" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">+</text><rect x="242" y="120" width="88" height="42" rx="8" fill="#d9f0e2" stroke="#6cb98d" stroke-width="1.5"/><text x="286" y="147" font-size="18" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">2</text><rect x="338" y="120" width="88" height="42" rx="8" fill="#d9f0e2" stroke="#6cb98d" stroke-width="1.5"/><text x="382" y="147" font-size="18" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">*</text><rect x="434" y="120" width="88" height="42" rx="8" fill="#d9f0e2" stroke="#6cb98d" stroke-width="1.5"/><text x="478" y="147" font-size="18" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">3</text><text x="50" y="82" font-size="15" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="start">opnd（数栈，自底向顶）：['7']</text><text x="50" y="106" font-size="15" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="start">optr（符栈，自底向顶）：\0</text><rect x="490" y="208" width="210" height="24" rx="8" fill="#d9eaf9" stroke="#6d9dd6" stroke-width="1.5"/><text x="595.0" y="224.68" font-size="13" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="middle">规则：</text><text x="50" y="216" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">opnd=[7]。</text><text x="50" y="242" font-size="14" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">为什么：'&gt;'再执行。</text></g><text x="24" y="312" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">prio(+, \0)=>：弹出+与1、6，算得7压回。</text><text x="24" y="336" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">为什么：逐层回溯至哨兵。</text><line x1="24" y1="348" x2="696" y2="348" stroke="#d5dfda"/></g></svg>