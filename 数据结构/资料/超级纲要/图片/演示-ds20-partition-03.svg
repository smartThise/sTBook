<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 372" width="780" height="372"><title>LUG划分：6怎样各就各位</title><rect width="780" height="372" fill="#ffffff"/><text x="24" y="30" font-size="18" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">LUG划分：6怎样各就各位</text><text x="756" y="30" font-size="13" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="end">第 3 / 4 步</text><g transform="translate(0,46)"><text x="24" y="24" font-size="17" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">3. L拓展：8归入G端</text><g transform="translate(0,36)"><text x="40" y="30" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">LUG划分：pivot=6，lo=2，hi=5，当前向左拓展G</text><rect x="40" y="90" width="110" height="52" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="95" y="122" font-size="18" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">1</text><rect x="158" y="90" width="110" height="52" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="213" y="122" font-size="18" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">3</text><rect x="276" y="90" width="110" height="52" rx="8" fill="#ffe9c4" stroke="#e0a243" stroke-width="1.5"/><text x="331" y="122" font-size="18" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">8</text><rect x="394" y="90" width="110" height="52" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="449" y="122" font-size="18" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">2</text><rect x="512" y="90" width="110" height="52" rx="8" fill="#ffe9c4" stroke="#e0a243" stroke-width="1.5"/><text x="567" y="122" font-size="18" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">9</text><rect x="630" y="90" width="110" height="52" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="685" y="122" font-size="18" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">8</text><text x="40" y="200" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">A=[1,3,·,2,9,8]。</text></g><text x="24" y="282" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">3<6留在L；8≥6被甩到右端A[5]，G换向。</text><text x="24" y="306" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">为什么：L=[0,2)={1,3}；空穴回到中间[2]。</text><line x1="24" y1="318" x2="756" y2="318" stroke="#d5dfda"/></g></svg>