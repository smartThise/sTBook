<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 392" width="700" height="392"><title>括号匹配：{[()]}怎样通过一个栈</title><rect width="700" height="392" fill="#ffffff"/><text x="24" y="30" font-size="18" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">括号匹配：{[()]}怎样通过一个栈</text><text x="676" y="30" font-size="13" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="end">第 5 / 7 步</text><g transform="translate(0,46)"><text x="24" y="24" font-size="17" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">5. ']'弹出'['</text><g transform="translate(0,36)"><text x="56" y="30" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">paren()：左括号一律进栈；右括号必须与栈顶同类</text><rect x="56" y="120" width="66" height="46" rx="8" fill="#d9f0e2" stroke="#6cb98d" stroke-width="1.5"/><text x="89.0" y="149" font-size="19" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">{</text><rect x="126" y="120" width="66" height="46" rx="8" fill="#d9f0e2" stroke="#6cb98d" stroke-width="1.5"/><text x="159.0" y="149" font-size="19" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">[</text><rect x="196" y="120" width="66" height="46" rx="8" fill="#d9f0e2" stroke="#6cb98d" stroke-width="1.5"/><text x="229.0" y="149" font-size="19" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">(</text><rect x="266" y="120" width="66" height="46" rx="8" fill="#d9f0e2" stroke="#6cb98d" stroke-width="1.5"/><text x="299.0" y="149" font-size="19" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">)</text><rect x="336" y="120" width="66" height="46" rx="8" fill="#ffe9c4" stroke="#e0a243" stroke-width="1.5"/><text x="369.0" y="149" font-size="19" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">]</text><rect x="406" y="120" width="66" height="46" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="439.0" y="149" font-size="19" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">}</text><text x="56" y="64" font-size="16" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="start">栈（自底向顶）：{</text><text x="56" y="216" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">字符4：']'与栈顶'['同类，弹出。</text></g><text x="24" y="302" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">字符4：']'与栈顶'['同类，弹出。</text><text x="24" y="326" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">为什么：若类型不同即失配。</text><line x1="24" y1="338" x2="676" y2="338" stroke="#d5dfda"/></g></svg>