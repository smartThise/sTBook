<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 422" width="760" height="422"><title>双栈当队：R进F出，倒腾一次</title><rect width="760" height="422" fill="#ffffff"/><text x="24" y="30" font-size="18" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">双栈当队：R进F出，倒腾一次</text><text x="736" y="30" font-size="13" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="end">第 3 / 5 步</text><g transform="translate(0,46)"><text x="24" y="24" font-size="17" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">3. dequeue出A</text><g transform="translate(0,36)"><text x="60" y="30" font-size="14" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">R栈：只管enqueue（新元素压入R顶）</text><text x="420" y="30" font-size="14" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">F栈：只管dequeue（从F顶弹出）</text><rect x="420" y="282" width="70" height="46" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="455.0" y="311" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">B</text><rect x="420" y="228" width="70" height="46" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="455.0" y="257" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">A</text><text x="60" y="252" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">弹出A。</text><text x="60" y="276" font-size="14" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">为什么：F顶=B，下一无需再倒腾。</text></g><text x="24" y="332" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">弹出F顶A。</text><text x="24" y="356" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">为什么：队首是最老的A，先进先出。</text><line x1="24" y1="368" x2="736" y2="368" stroke="#d5dfda"/></g></svg>