<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 505" width="800" height="505"><title>Dijkstra：一次只检查一条出边</title><rect width="800" height="505" fill="#ffffff"/><text x="20" y="28" font-size="19" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">Dijkstra：一次只检查一条出边</text><g transform="translate(0,45)"><text x="20" y="26" font-size="20" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">9. 检查一条出边并松弛</text><g transform="translate(0,48)"><line x1="106.81913598619224" y1="91.95425920414233" x2="253.18086401380776" y2="48.04574079585767" stroke="#c6d2cc" stroke-width="3"></line><line x1="253.18086401380776" y1="48.04574079585767" x2="245.80600924817261" y2="54.79937072248145" stroke="#c6d2cc" stroke-width="3"></line><line x1="253.18086401380776" y1="48.04574079585767" x2="243.30628071775064" y2="46.466942287741574" stroke="#c6d2cc" stroke-width="3"></line><text x="165.0" y="62.0" font-size="12" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">S→A: 4</text><line x1="105.99734734478726" y1="110.3989389379149" x2="254.00265265521273" y2="169.6010610620851" stroke="#c6d2cc" stroke-width="3"></line><line x1="254.00265265521273" y1="169.6010610620851" x2="244.02678975707346" y2="170.29543807605393" stroke="#c6d2cc" stroke-width="3"></line><line x1="254.00265265521273" y1="169.6010610620851" x2="247.25763263515933" y2="162.21833088083923" stroke="#c6d2cc" stroke-width="3"></line><text x="165.0" y="132.0" font-size="12" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">S→B: 1</text><line x1="307.09328362711165" y1="47.06781312011608" x2="482.90671637288835" y2="92.93218687988393" stroke="#a76322" stroke-width="3"></line><line x1="482.90671637288835" y1="92.93218687988393" x2="473.0958864285878" y2="94.86806285835354" stroke="#a76322" stroke-width="3"></line><line x1="482.90671637288835" y1="92.93218687988393" x2="475.29178293486615" y2="86.45045958428663" stroke="#a76322" stroke-width="3"></line><text x="380.0" y="62.0" font-size="12" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">A→T: 1</text><line x1="280.0" y1="152.0" x2="280.0" y2="68.0" stroke="#c6d2cc" stroke-width="3"></line><line x1="280.0" y1="68.0" x2="284.3496553411123" y2="77.00447102352678" stroke="#c6d2cc" stroke-width="3"></line><line x1="280.0" y1="68.0" x2="275.6503446588877" y2="77.00447102352678" stroke="#c6d2cc" stroke-width="3"></line><text x="292.0" y="102.0" font-size="12" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">B→A: 2</text><line x1="306.44591030777246" y1="170.80142250164437" x2="483.55408969222754" y2="109.19857749835563" stroke="#c6d2cc" stroke-width="3"></line><line x1="483.55408969222754" y1="109.19857749835563" x2="476.47834714541443" y2="116.26496748272663" stroke="#c6d2cc" stroke-width="3"></line><line x1="483.55408969222754" y1="109.19857749835563" x2="473.6204441635317" y2="108.04849640981382" stroke="#c6d2cc" stroke-width="3"></line><text x="380.0" y="132.0" font-size="12" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">B→T: 5</text><circle cx="80" cy="100" r="28" fill="#d7eee3" stroke="#25332f"></circle><text x="72" y="106" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">S</text><circle cx="280" cy="40" r="28" fill="#d7eee3" stroke="#25332f"></circle><text x="272" y="46" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">A</text><circle cx="280" cy="180" r="28" fill="#d7eee3" stroke="#25332f"></circle><text x="272" y="186" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">B</text><circle cx="510" cy="100" r="28" fill="#f5f8f6" stroke="#25332f"></circle><text x="502" y="106" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">T</text><text x="610" y="25" font-size="15" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">点   距离d   前驱</text><text x="620" y="65" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">S</text><text x="675" y="65" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">0</text><text x="745" y="65" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">无</text><text x="620" y="110" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">A</text><text x="675" y="110" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">3</text><text x="745" y="110" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">B</text><text x="620" y="155" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">B</text><text x="675" y="155" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">1</text><text x="745" y="155" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">S</text><text x="620" y="200" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">T</text><text x="675" y="200" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">4</text><text x="745" y="200" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">A</text><text x="20" y="270" font-size="15" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">绿色＝距离已确定；边标签明确写出方向。</text></g><text x="20" y="368" font-size="16" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">d[T]从6改为3+1=4，前驱改为A。</text><text x="20" y="393" font-size="16" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">原因：尝试把当前到A的路径后面接上A→T；只保留更短的候选。</text><line x1="20" y1="428" x2="780" y2="428" stroke="#c6d2cc"></line></g></svg>
