<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 550" width="800" height="550"><title>最大堆：建堆和删除最大值</title><rect width="800" height="550" fill="#ffffff"/><text x="20" y="28" font-size="19" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">最大堆：建堆和删除最大值</text><g transform="translate(0,45)"><text x="20" y="26" font-size="20" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">6. 删除末尾格，暂存其值</text><g transform="translate(0,48)"><line x1="400.0" y1="40" x2="200.0" y2="107" stroke="#c6d2cc" stroke-width="3"></line><line x1="400.0" y1="40" x2="600.0" y2="107" stroke="#c6d2cc" stroke-width="3"></line><circle cx="400.0" cy="40" r="22" fill="#d7eee3" stroke="#25332f"></circle><text x="388.0" y="46" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">4</text><circle cx="200.0" cy="107" r="22" fill="#d7eee3" stroke="#25332f"></circle><text x="188.0" y="113" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">2</text><circle cx="600.0" cy="107" r="22" fill="#d7eee3" stroke="#25332f"></circle><text x="588.0" y="113" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">3</text><text x="20" y="282" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">对应数组</text><rect x="140" y="255" width="79" height="42" rx="3" fill="#f5f8f6" stroke="#c6d2cc"></rect><text x="150" y="283" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">4</text><text x="150" y="315" font-size="12" fill="#596c64" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">0</text><rect x="222" y="255" width="79" height="42" rx="3" fill="#f5f8f6" stroke="#c6d2cc"></rect><text x="232" y="283" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">2</text><text x="232" y="315" font-size="12" fill="#596c64" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">1</text><rect x="304" y="255" width="79" height="42" rx="3" fill="#f5f8f6" stroke="#c6d2cc"></rect><text x="314" y="283" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">3</text><text x="314" y="315" font-size="12" fill="#596c64" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">2</text></g><text x="20" y="413" font-size="16" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">最大值4已经暂存返回；另取末尾值1。</text><text x="20" y="438" font-size="16" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">原因：物理删除必须发生在末尾，才能保留完全二叉树的形状。</text><line x1="20" y1="473" x2="780" y2="473" stroke="#c6d2cc"></line></g></svg>
