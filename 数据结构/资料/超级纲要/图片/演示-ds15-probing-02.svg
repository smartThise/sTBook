<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 382" width="780" height="382"><title>线性试探：冲突怎样连成一片</title><rect width="780" height="382" fill="#ffffff"/><text x="24" y="30" font-size="18" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">线性试探：冲突怎样连成一片</text><text x="756" y="30" font-size="13" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="end">第 2 / 5 步</text><g transform="translate(0,46)"><text x="24" y="24" font-size="17" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">2. 插入12：直接命中</text><g transform="translate(0,36)"><text x="40" y="30" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">闭散列·线性试探：M=7，hash(k)=k % 7</text><rect x="40" y="110" width="94" height="46" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="87.0" y="139" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle"></text><text x="87.0" y="174" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">0</text><rect x="138" y="110" width="94" height="46" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="185.0" y="139" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle"></text><text x="185.0" y="174" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">1</text><rect x="236" y="110" width="94" height="46" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="283.0" y="139" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle"></text><text x="283.0" y="174" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">2</text><rect x="334" y="110" width="94" height="46" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="381.0" y="139" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle"></text><text x="381.0" y="174" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">3</text><rect x="432" y="110" width="94" height="46" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="479.0" y="139" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle"></text><text x="479.0" y="174" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">4</text><rect x="530" y="110" width="94" height="46" rx="8" fill="#ffe9c4" stroke="#e0a243" stroke-width="1.5"/><text x="577.0" y="139" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">12</text><text x="577.0" y="174" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">5</text><rect x="628" y="110" width="94" height="46" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="675.0" y="139" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle"></text><text x="675.0" y="174" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">6</text><text x="40" y="200" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">None</text></g><text x="24" y="292" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">12 % 7 = 5，桶[5]空，直接放入。</text><text x="24" y="316" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">为什么：无冲突时一次定位。</text><line x1="24" y1="328" x2="756" y2="328" stroke="#d5dfda"/></g></svg>