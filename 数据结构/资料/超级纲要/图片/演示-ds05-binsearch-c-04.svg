ans-serif" text-anchor="start">S[2]=C。D&lt;C不成立：e只可能在(2,5)，lo=3。</text><text x="36" y="216" font-size="15" fill="#5c6f68" font-family="Menlo, Consolas, monospace" text-anchor="start">lo=0，hi=5，mi=2，区间宽度11→…逐次折半</text></g><text x="24" y="302" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">S[2]=C。D<C不成立：e只可能在(2,5)，lo=3。</text><text x="24" y="326" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">为什么：else分支：lo=mi+1，轴点被排除。</text><line x1="24" y1="338" x2="736" y2="338" stroke="#d5dfda"/></g></svg>