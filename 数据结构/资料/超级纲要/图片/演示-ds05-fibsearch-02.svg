<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 402" width="760" height="402"><title>Fibonacci查找：切分点4→6→5</title><rect width="760" height="402" fill="#ffffff"/><text x="24" y="30" font-size="18" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">Fibonacci查找：切分点4→6→5</text><text x="736" y="30" font-size="13" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="end">第 2 / 5 步</text><g transform="translate(0,46)"><text x="24" y="24" font-size="17" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">2. 第1次探测：mi=4</text><g transform="translate(0,36)"><rect x="30" y="116" width="96" height="46" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="78.0" y="145.0" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">2</text><text x="78.0" y="178" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">0</text><rect x="128" y="116" width="96" height="46" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="176.0" y="145.0" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">4</text><text x="176.0" y="178" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">1</text><rect x="226" y="116" width="96" height="46" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="274.0" y="145.0" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">6</text><text x="274.0" y="178" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">2</text><rect x="324" y="116" width="96" height="46" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="372.0" y="145.0" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">8</text><text x="372.0" y="178" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">3</text><rect x="422" y="116" width="96" height="46" rx="8" fill="#ffe9c4" stroke="#e0a243" stroke-width="1.5"/><text x="470.0" y="145.0" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">10</text><text x="470.0" y="178" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">4</text><rect x="520" y="116" width="96" height="46" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="568.0" y="145.0" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">11</text><text x="568.0" y="178" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">5</text><rect x="618" y="116" width="96" height="46" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="666.0" y="145.0" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">12</text><text x="666.0" y="178" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">6</text><text x="30" y="40" font-size="15" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="start">fib.get() = 5；切分点 mi = lo + fib.get() − 1 = 4</text><text x="30" y="194" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">S[4]=10 &lt; 11：e只可能在(4,7)，lo=5。</text><text x="30" y="220" font-size="15" fill="#5c6f68" font-family="Menlo, Consolas, monospace" text-anchor="start">lo=0，hi=7</text></g><text x="24" y="312" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">S[4]=10 < 11：e只可能在(4,7)，lo=5。</text><text x="24" y="336" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">为什么：深入后半段只需2次比较的一半，所以前段故意放长。</text><line x1="24" y1="348" x2="736" y2="348" stroke="#d5dfda"/></g></svg>