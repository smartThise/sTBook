<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 382" width="900" height="382"><title>uniquify：双指针一次扫描去重</title><rect width="900" height="382" fill="#ffffff"/><text x="24" y="30" font-size="18" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">uniquify：双指针一次扫描去重</text><text x="876" y="30" font-size="13" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="end">第 8 / 13 步</text><g transform="translate(0,46)"><text x="24" y="24" font-size="17" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">8. j=7：A[7]=A[2]=8，重复</text><g transform="translate(0,36)"><rect x="24" y="100" width="70" height="44" rx="8" fill="#d9f0e2" stroke="#6cb98d" stroke-width="1.5"/><text x="59.0" y="128.0" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">3</text><text x="59.0" y="160" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">0</text><rect x="96" y="100" width="70" height="44" rx="8" fill="#d9f0e2" stroke="#6cb98d" stroke-width="1.5"/><text x="131.0" y="128.0" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">5</text><text x="131.0" y="160" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">1</text><rect x="168" y="100" width="70" height="44" rx="8" fill="#d9eaf9" stroke="#6d9dd6" stroke-width="1.5"/><text x="203.0" y="128.0" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">8</text><text x="203.0" y="160" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">2</text><rect x="240" y="100" width="70" height="44" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="275.0" y="128.0" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">5</text><text x="275.0" y="160" font-size="12"