" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">13</text><text x="707.0" y="160" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">9</text><rect x="744" y="100" width="70" height="44" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="779.0" y="128.0" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">13</text><text x="779.0" y="160" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">10</text><rect x="816" y="100" width="70" height="44" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="851.0" y="128.0" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">13</text><text x="851.0" y="160" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">11</text><line x1="202.0" y1="60" x2="202.0" y2="74" stroke="#6d9dd6" stroke-width="2"/><circle cx="202.0" cy="78" r="3.5" fill="#6d9dd6" stroke="none" stroke-width="1"/><rect x="192.0" y="84" width="20" height="20" rx="6" fill="#ffffff" stroke="#6d9dd6" stroke-width="1.2"/><text x="202.0" y="99" font-size="13" fill="#6d9dd6" font-family="Menlo, Consolas, monospace" text-anchor="middle">i</text><line x1="562.0" y1="166" x2="562.0" y2="180" stroke="#e0a243" stroke-width="2"/><circle cx="562.0" cy="184" r="3.5" fill="#e0a243" stroke="none" stroke-width="1"/><rect x="552.0" y="190" width="20" height="20" rx="6" fill="#ffffff" stroke="#e0a243" stroke-width="1.2"/><text x="562.0" y="205" font-size="13" fill="#e0a243" font-family="Menlo, Consolas, monospace" text-anchor="middle">j</text><text x="24" y="40" font-size="15" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="start">已确认无重复的前缀：[0, 2]</text><text x="24" y="186" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">跳过。</text><text x="24" y="212" font-size="14" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">为什么：与保留区末尾相等者不必保留两份。</text></g><text x="24" y="292" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">j右移一格，i不动。</text><text x="24" y="316" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">为什么：重复元素被跳过，不进入保留区。</text><line x1="24" y1="328" x2="876" y2="328" stroke="#d5dfda"/></g></svg>