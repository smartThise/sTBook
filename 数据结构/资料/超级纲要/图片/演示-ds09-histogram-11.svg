ze="15" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">5</text><text x="391.0" y="280" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">3</text><rect x="448" y="228" width="90" height="18" rx="4" fill="#d9f0e2" stroke="#d9e2dd" stroke-width="1.5"/><text x="493.0" y="262" font-size="15" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">1</text><text x="493.0" y="280" font-size="12" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">4</text><text x="40" y="216" font-size="14" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="start">栈（自底→顶）：（空）</text><text x="40" y="266" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">全程各块面积：[2, 8, 5, 4]，最大8。</text></g><text x="24" y="352" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">末尾哨兵把滞留的r4结算：宽5×高1=5。</text><text x="24" y="376" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">为什么：清栈阶段每个滞留柱子的右边界都是n。</text><line x1="24" y1="388" x2="756" y2="388" stroke="#d5dfda"/></g></svg>