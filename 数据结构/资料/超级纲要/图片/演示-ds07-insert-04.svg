<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 442" width="720" height="442"><title>前插入：三根指针的次序</title><rect width="720" height="442" fill="#ffffff"/><text x="24" y="30" font-size="18" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">前插入：三根指针的次序</text><text x="696" y="30" font-size="13" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="end">第 4 / 4 步</text><g transform="translate(0,46)"><text x="24" y="24" font-size="17" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">4. 第三步：pred = x</text><g transform="translate(0,36)"><text x="40" y="30" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">逐步演示</text><rect x="60" y="150" width="130" height="54" rx="10" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="125.0" y="172" font-size="18" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">A</text><text x="80" y="194" font-size="10" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="start">pred</text><text x="170" y="194" font-size="10" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="end">succ</text><rect x="240" y="150" width="130" height="54" rx="10" fill="#d9eaf9" stroke="#6d9dd6" stroke-width="1.5"/><text x="305.0" y="172" font-size="18" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">X</text><text x="260" y="194" font-size="10" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="start">pred</text><text x="350" y="194" font-size="10" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="end">succ</text><rect x="420" y="150" width="130" height="54" rx="10" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="485.0" y="172" font-size="18" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">B</text><text x="440" y="194" font-size="10" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="start">pred</text><text x="530" y="194" font-size="10" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="end">succ</text><line x1="125.0" y1="132" x2="485.0" y2="132" stroke="#d9e2dd" stroke-width="1.4"/><line x1="125.0" y1="132" x2="305.0" y2="132" stroke="#6d9dd6" stroke-width="2.2"/><circle cx="305.0" cy="132" r="3" fill="#6d9dd6" stroke="none" stroke-width="1"/><line x1="305.0" y1="132" x2="485.0" y2="132" stroke="#6d9dd6" stroke-width="2.2"/><circle cx="485.0" cy="132" r="3" fill="#6d9dd6" stroke="none" stroke-width="1"/><text x="40" y="240" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">三步完成：A → X → B。</text><text x="40" y="266" font-size="14" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">为什么：局部改动常数个指针，与列表总长无关。</text></g><text x="24" y="352" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">让B的pred改指X。</text><text x="24" y="376" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">为什么：反向链补齐，双向链表恢复一致；整个过程O(1)。</text><line x1="24" y1="388" x2="696" y2="388" stroke="#d5dfda"/></g></svg>