<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 442" width="760" height="442"><title>层次遍历：队列怎样决定访问次序</title><rect width="760" height="442" fill="#ffffff"/><text x="24" y="30" font-size="18" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">层次遍历：队列怎样决定访问次序</text><text x="736" y="30" font-size="13" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="end">第 5 / 8 步</text><g transform="translate(0,46)"><text x="24" y="24" font-size="17" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">5. 出队访问 D</text><g transform="translate(0,36)"><text x="40" y="30" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">层次遍历：队列Q；出队→访问→孩子依次入队</text><line x1="330" y1="136" x2="180" y2="194" stroke="#d5dfda" stroke-width="1.6"/><line x1="330" y1="136" x2="480" y2="194" stroke="#d5dfda" stroke-width="1.6"/><line x1="180" y1="226" x2="100" y2="284" stroke="#d5dfda" stroke-width="1.6"/><line x1="180" y1="226" x2="260" y2="284" stroke="#d5dfda" stroke-width="1.6"/><line x1="480" y1="226" x2="560" y2="284" stroke="#d5dfda" stroke-width="1.6"/><rect x="296" y="106" width="68" height="40" rx="10" fill="#d9f0e2" stroke="#6cb98d" stroke-width="1.5"/><text x="330" y="132" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">A</text><rect x="146" y="196" width="68" height="40" rx="10" fill="#d9f0e2" stroke="#6cb98d" stroke-width="1.5"/><text x="180" y="222" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">B</text><rect x="446" y="196" width="68" height="40" rx="10" fill="#d9f0e2" stroke="#6cb98d" stroke-width="1.5"/><text x="480" y="222" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">C</text><rect x="66" y="286" width="68" height="40" rx="10" fill="#ffe9c4" stroke="#e0a243" stroke-width="1.5"/><text x="100" y="312" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">D</text><rect x="226" y="286" width="68" height="40" rx="10" fill="#d9eaf9" stroke="#6d9dd6" stroke-width="1.5"/><text x="260" y="312" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">E</text><rect x="526" y="286" width="68" height="40" rx="10" fill="#d9eaf9" stroke="#6d9dd6" stroke-width="1.5"/><text x="560" y="312" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">F</text><text x="40" y="36" font-size="15" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="start">队列Q（自队首向队尾）：E F</text><text x="40" y="288" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">访问D，叶节点无孩子。</text></g><text x="24" y="352" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">访问D，叶节点无孩子。</text><text x="24" y="376" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">为什么：先访问者，其孩子先入队——同层次序由入队次序保证。</text><line x1="24" y1="388" x2="736" y2="388" stroke="#d5dfda"/></g></svg>