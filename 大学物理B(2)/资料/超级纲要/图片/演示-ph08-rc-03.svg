<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 372" width="720" height="372"><title>RC充电：Q怎样逼近CE</title><rect width="720" height="372" fill="#ffffff"/><text x="24" y="30" font-size="18" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">RC充电：Q怎样逼近CE</text><text x="696" y="30" font-size="13" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="end">第 3 / 3 步</text><g transform="translate(0,46)"><text x="24" y="24" font-size="17" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">3. 充满 t→∞</text><g transform="translate(0,36)"><text x="40" y="30" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">RC充电：Q(t)=CE(1−e^(−t/RC))，阶段：t→∞</text><line x1="60" y1="120" x2="60" y2="160" stroke="#22313a" stroke-width="2"/><line x1="46" y1="160" x2="74" y2="160" stroke="#22313a" stroke-width="3"/><line x1="53" y1="172" x2="67" y2="172" stroke="#22313a" stroke-width="3"/><line x1="60" y1="172" x2="60" y2="210" stroke="#22313a" stroke-width="2"/><line x1="60" y1="120" x2="280" y2="120" stroke="#22313a" stroke-width="2"/><line x1="60" y1="210" x2="280" y2="210" stroke="#22313a" stroke-width="2"/><line x1="280" y1="120" x2="280" y2="152" stroke="#22313a" stroke-width="2"/><line x1="280" y1="178" x2="280" y2="210" stroke="#22313a" stroke-width="2"/><line x1="268" y1="152" x2="292" y2="152" stroke="#22313a" stroke-width="3"/><line x1="268" y1="178" x2="292" y2="178" stroke="#22313a" stroke-width="3"/><circle cx="274" cy="140" r="3" fill="#6d9dd6" stroke="none" stroke-width="1"/><circle cx="274" cy="132" r="3" fill="#6d9dd6" stroke="none" stroke-width="1"/><circle cx="274" cy="124" r="3" fill="#6d9dd6" stroke="none" stroke-width="1"/><circle cx="274" cy="116" r="3" fill="#6d9dd6" stroke="none" stroke-width="1"/><circle cx="274" cy="108" r="3" fill="#6d9dd6" stroke="none" stroke-width="1"/><circle cx="274" cy="100" r="3" fill="#6d9dd6" stroke="none" stroke-width="1"/><circle cx="286" cy="192" r="3" fill="#d89393" stroke="none" stroke-width="1"/><circle cx="286" cy="184" r="3" fill="#d89393" stroke="none" stroke-width="1"/><circle cx="286" cy="176" r="3" fill="#d89393" stroke="none" stroke-width="1"/><circle cx="286" cy="168" r="3" fill="#d89393" stroke="none" stroke-width="1"/><circle cx="286" cy="160" r="3" fill="#d89393" stroke="none" stroke-width="1"/><circle cx="286" cy="152" r="3" fill="#d89393" stroke="none" stroke-width="1"/><text x="320" y="164" font-size="15" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="start">Q = 6/6 · CE</text><text x="40" y="200" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">充满：Q=CE。</text></g><text x="24" y="282" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">Q=CE：两板电压等于电源电动势，电流归零。</text><text x="24" y="306" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">为什么：电容器隔直流：充满后稳态无电流。</text><line x1="24" y1="318" x2="696" y2="318" stroke="#d5dfda"/></g></svg>