<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 382" width="720" height="382"><title>安培环路：B·2πr=μ₀I</title><rect width="720" height="382" fill="#ffffff"/><text x="24" y="30" font-size="18" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">安培环路：B·2πr=μ₀I</text><text x="696" y="30" font-size="13" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="end">第 3 / 3 步</text><g transform="translate(0,46)"><text x="24" y="24" font-size="17" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">3. 与半径的关系</text><g transform="translate(0,36)"><text x="40" y="30" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">安培环路定理：∮B·dl = μ₀·I(环路包围的电流)</text><circle cx="200" cy="130" r="5" fill="#e0a243" stroke="none" stroke-width="1"/><text x="212" y="122" font-size="13" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">I（流出纸面）</text><circle cx="200" cy="130" r="50" fill="none" stroke="#d9e2dd" stroke-width="1.4"/><text x="235.0" y="95.0" font-size="13" fill="#6d9dd6" font-family="Menlo, Consolas, monospace" text-anchor="start"></text><circle cx="200" cy="130" r="100" fill="none" stroke="#6d9dd6" stroke-width="2"/><text x="270.0" y="60.0" font-size="13" fill="#6d9dd6" font-family="Menlo, Consolas, monospace" text-anchor="start">B = μ₀I/2πr</text><circle cx="286.60256249168367" cy="179.99996169872557" r="3" fill="#6d9dd6" stroke="none" stroke-width="1"/><circle cx="113.39757018800925" cy="180.00019150622543" r="3" fill="#6d9dd6" stroke="none" stroke-width="1"/><circle cx="199.99960196153094" cy="30.000000000792184" r="3" fill="#6d9dd6" stroke="none" stroke-width="1"/><text x="420" y="110" font-size="15" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="start">对称性：B沿圆周切向</text><text x="420" y="138" font-size="15" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="start">大小处处相等 ⇒ ∮B·dl = B·2πr</text><text x="420" y="166" font-size="15" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="start">⇒ B = μ₀I/2πr</text><text x="40" y="216" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">B∝1/r。</text></g><text x="24" y="292" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">r加倍则B减半；环路不包围电流时积分为零。</text><text x="24" y="316" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">为什么：与静电高斯定理对偶：通量/环流只看包围的源。</text><line x1="24" y1="328" x2="696" y2="328" stroke="#d5dfda"/></g></svg>