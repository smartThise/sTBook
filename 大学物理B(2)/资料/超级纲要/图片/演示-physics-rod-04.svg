<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520"><title>细棒电场：源、位移、投影与对称配对</title><rect width="800" height="520" fill="#ffffff"/><text x="20" y="28" font-size="19" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">细棒电场：源、位移、投影与对称配对</text><g transform="translate(0,45)"><text x="20" y="26" font-size="20" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">4. 把场向量投影到竖直方向</text><g transform="translate(0,48)"><line x1="120" y1="250" x2="680" y2="250" stroke="#25332f" stroke-width="6"></line><text x="100" y="280" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">−L</text><text x="365" y="280" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">O：x=0</text><text x="680" y="280" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">+L</text><circle cx="400" cy="90" r="5" fill="#25332f"></circle><text x="420" y="85" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">P=(0,y)，y&gt;0</text><line x1="400" y1="90" x2="400" y2="250" stroke="#c6d2cc"></line><text x="410" y="175" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">y</text><text x="20" y="45" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">均匀正电荷细棒，线密度 λ</text><rect x="555" y="239" width="18" height="22" fill="#ffe2b6" stroke="#25332f"></rect><text x="555" y="220" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">x处，宽dx</text><line x1="564" y1="246" x2="405" y2="96" stroke="#497563" stroke-width="3"></line><line x1="405" y1="96" x2="414.53461741174607" y2="99.01514026400571" stroke="#497563" stroke-width="3"></line><line x1="405" y1="96" x2="408.56497272169145" y2="105.34296363546365" stroke="#497563" stroke-width="3"></line><text x="490" y="150" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">R=(-x,y)</text><line x1="400" y1="90" x2="320" y2="12" stroke="#a76322" stroke-width="3"></line><line x1="320" y1="12" x2="329.48369749579683" y2="15.171668615763068" stroke="#a76322" stroke-width="3"></line><line x1="320" y1="12" x2="323.4107075243027" y2="21.400376278834" stroke="#a76322" stroke-width="3"></line><text x="290" y="26" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">dE</text></g><text x="20" y="383" font-size="16" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">dE大小=kλdx/R²；竖直比例=y/R，故dEy=kλy dx/R³。</text><text x="20" y="408" font-size="16" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">原因：单位方向向量的竖直分量是y/R；投影使分母多出一个R。</text><line x1="20" y1="443" x2="780" y2="443" stroke="#c6d2cc"></line></g></svg>
