<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" width="760" height="392"><title>磁铁插入线圈：磁通与阻碍</title><rect width="760" height="392" fill="#ffffff"/><text x="24" y="30" font-size="18" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">磁铁插入线圈：磁通与阻碍</text><text x="736" y="30" font-size="13" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="end">第 2 / 3 步</text><g transform="translate(0,46)"><text x="24" y="24" font-size="17" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">2. 插入中：磁通增大</text><g transform="translate(0,36)"><text x="40" y="30" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">电磁感应：磁铁N极插入线圈，磁通增大，感应电流方向阻碍增大</text><line x1="140" y1="95" x2="140" y2="185" stroke="#d9e2dd" stroke-width="3"/><line x1="164" y1="95" x2="164" y2="185" stroke="#d9e2dd" stroke-width="3"/><line x1="188" y1="95" x2="188" y2="185" stroke="#d9e2dd" stroke-width="3"/><line x1="212" y1="95" x2="212" y2="185" stroke="#d9e2dd" stroke-width="3"/><line x1="236" y1="95" x2="236" y2="185" stroke="#d9e2dd" stroke-width="3"/><rect x="178" y="50" width="44" height="40" rx="4" fill="#fbe4e4" stroke="#d89393" stroke-width="1.5"/><text x="200" y="76" font-size="17" fill="#d89393" font-family="Menlo, Consolas, monospace" text-anchor="middle">N</text><rect x="178" y="90" width="44" height="40" rx="4" fill="#d9eaf9" stroke="#6d9dd6" stroke-width="1.5"/><text x="200" y="116" font-size="17" fill="#6d9dd6" font-family="Menlo, Consolas, monospace" text-anchor="middle">S</text><line x1="240" y1="60" x2="240" y2="100" stroke="#e0a243" stroke-width="2"/><circle cx="240" cy="100" r="3" fill="#e0a243" stroke="none" stroke-width="1"/><text x="40" y="226" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">磁通增大中。</text></g><text x="24" y="302" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">N极逼近，向下穿过线圈的磁通增大。</text><text x="24" y="326" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">为什么：楞次定律：感应电流的磁场要阻碍磁通的增大——感应磁场方向向上。</text><line x1="24" y1="338" x2="736" y2="338" stroke="#d5dfda"/></g></svg>