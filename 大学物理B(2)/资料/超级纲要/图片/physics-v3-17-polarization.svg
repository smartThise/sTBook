<text x="246" y="347" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Arial, sans-serif" font-size="18" fill="#192c40">Ex=(√3/2)E₀ cosωt；Ey=(1/2)E₀ sinωt</text>
<text x="716" y="26" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Arial, sans-serif" font-size="20" fill="#192c40">每过一片，都更新“当前的光”</text>
