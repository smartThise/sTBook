<text x="715" y="180" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Arial, sans-serif" font-size="18" fill="#192c40">线偏振，沿0°</text>
<rect x="510" y="208" width="410" height="54" rx="4" fill="#f0f5fa" stroke="#c0cfdb" stroke-width="1.5"/>
<text x="715" y="229" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Arial, sans-serif" font-size="18" fill="#192c40">45°四分之一波片后 I₀/2</text>
<text x="715" y="252" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Arial, sans-serif" font-size="18" fill="#192c40">等幅正交，差π/2 → 圆</text>
<rect x="510" y="280" width="410" height="54" rx="4" fill="#f0f5fa" stroke="#c0cfdb" stroke-width="1.5"/>
<text x="715" y="301" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Arial, sans-serif" font-size="18" fill="#192c40">任意角检偏器后 I₀/4</text>
<text x="715" y="324" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Arial, sans-serif" font-size="18" fill="#192c40">圆在任一轴上平均取一半</text></svg>