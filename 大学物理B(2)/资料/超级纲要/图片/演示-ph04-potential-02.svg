<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 382" width="720" height="382"><title>等势面：电场线处处垂直于它</title><rect width="720" height="382" fill="#ffffff"/><text x="24" y="30" font-size="18" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">等势面：电场线处处垂直于它</text><text x="696" y="30" font-size="13" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="end">第 2 / 2 步</text><g transform="translate(0,46)"><text x="24" y="24" font-size="17" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">2. 沿等势面移动不做功</text><g transform="translate(0,36)"><text x="40" y="30" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">点电荷的等势面是同心球面；电场线沿半径，与等势面处处垂直</text><circle cx="220" cy="130" r="46" fill="none" stroke="#6d9dd6" stroke-width="1.6"/><text x="253.12" y="96.88" font-size="12" fill="#6d9dd6" font-family="Menlo, Consolas, monospace" text-anchor="start">46V</text><circle cx="220" cy="130" r="84" fill="none" stroke="#6d9dd6" stroke-width="1.6"/><circle cx="220" cy="130" r="122" fill="none" stroke="#6d9dd6" stroke-width="1.6"/><line x1="232.0" y1="130.0" x2="350.0" y2="130.0" stroke="#e0a243" stroke-width="1.4"/><line x1="226.00000919230234" y1="140.39229953822962" x2="285.0000995832754" y2="242.58324499748744" stroke="#e0a243" stroke-width="1.4"/><line x1="214.00001838461876" y1="140.39231545975616" x2="155.00019916670334" y2="242.5834174806919" stroke="#e0a243" stroke-width="1.4"/><line x1="208.00000000004223" y1="130.00003184307752" x2="90.0000000004577" y2="130.00034496667314" stroke="#e0a243" stroke-width="1.4"/><line x1="213.9999632308188" y1="119.60771638337013" x2="154.99960166720362" y2="17.416927486509763" stroke="#e0a243" stroke-width="1.4"/><line x1="225.99995403841788" y1="119.60766861879044" x2="284.9995020828603" y2="17.416410036896437" stroke="#e0a243" stroke-width="1.4"/><circle cx="220" cy="130" r="4" fill="#e0a243" stroke="none" stroke-width="1"/><circle cx="304" cy="46" r="5" fill="#d89393" stroke="none" stroke-width="1"/><circle cx="328" cy="36" r="5" fill="#d89393" stroke="none" stroke-width="1"/><text x="320" y="30" font-size="13" fill="#d89393" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">沿等势面移动：W=0</text><text x="40" y="216" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">试探电荷沿等势面滑动：W=0。</text></g><text x="24" y="292" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">W = qU = q(V₁−V₂) = 0：电势差为零。</text><text x="24" y="316" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">为什么：做功只看起止电势差，与路径无关——静电场是保守场。</text><line x1="24" y1="328" x2="696" y2="328" stroke="#d5dfda"/></g></svg>