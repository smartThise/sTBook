<svg xmlns="http://www.w3.org/2000/svg" width="930" height="330" viewBox="0 0 930 330"><rect width="100%" height="100%" fill="white"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#506276"/></marker></defs>
<text x="466" y="26" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Arial, sans-serif" font-size="20" fill="#192c40">矩形势垒：先选好各区解，再在0和a匹配</text>
<line x1="55" y1="240" x2="880" y2="240" stroke="#6b8095" stroke-width="2"/>
<polygon points="880,240 871.0,236.0 871.0,244.0" fill="#6b8095"/>
<rect x="358" y="79" width="220" height="161" rx="0" fill="#edf3fa" stroke="#7f99b0" stroke-width="1.5"/>
<text x="465" y="68" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Arial, sans-serif" font-size="20" fill="#192c40">U₀</text>
<text x="335" y="272" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Arial, sans-serif" font-size="20" fill="#192c40">0</text>
<text x="588" y="272" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Arial, sans-serif" font-size="20" fill="#192c40">a</text>
<text x="868" y="270" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Arial, sans-serif" font-size="20" fill="#192c40">x</text>
<line x1="55" y1="162" x2="875" y2="162" stroke="#b3764a" stroke-width="2" stroke-dasharray="5 4"/>
<text x="860" y="148" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Arial, sans-serif" font-size="18" fill="#192c40">E&lt;U₀</text>
<line x1="94" y1="110" x2="260" y2="110" stroke="#2a7b9d" stroke-width="2"/>
<polygon points="260,110 251.0,106.0 251.0,114.0" fill="#2a7b9d"/>
<text x="187" y="90" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Arial, sans-serif" font-size="18" fill="#192c40">A exp(ikx)</text>
<line x1="260" y1="202" x2="94" y2="202" stroke="#b27346" stroke-width="2"/>
<polygon points="94,202 103.0,206.0 103.0,198.0" fill="#b27346"/>
<text x="187" y="226" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Arial, sans-serif" font-size="18" fill="#192c40">B exp(−ikx)</text>
<line x1="663" y1="110" x2="835" y2="110" stroke="#2a7b9d" stroke-width="2"/>
<polygon points="835,110 826.0,106.0 826.0,114.0" fill="#2a7b9d"/>
<text x="747" y="89" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Arial, sans-serif" font-size="18" fill="#192c40">F exp[ik(x−a)]</text>
<text x="467" y="197" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Arial, sans-serif" font-size="19" fill="#192c40">垒内：指数解</text>
<text x="466" y="312" text-anchor="middle" font-family="Noto Sans CJK SC, PingFang SC, Arial, sans-serif" font-size="18" fill="#192c40">左右U=0，所以入射与透射波数相同，T=|F/A|²</text></svg>