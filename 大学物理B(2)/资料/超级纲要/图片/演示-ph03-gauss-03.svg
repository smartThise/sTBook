<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 402" width="720" height="402"><title>高斯面：半径加倍，通量不变</title><rect width="720" height="402" fill="#ffffff"/><text x="24" y="30" font-size="18" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">高斯面：半径加倍，通量不变</text><text x="696" y="30" font-size="13" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="end">第 3 / 3 步</text><g transform="translate(0,46)"><text x="24" y="24" font-size="17" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">3. 高斯定理</text><g transform="translate(0,36)"><text x="40" y="30" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">高斯面：球面半径r=2倍，电场E∝1/r²，通量Φ=E·4πr²</text><circle cx="250" cy="150" r="110" fill="none" stroke="#6d9dd6" stroke-width="2"/><circle cx="250" cy="150" r="4" fill="#e0a243" stroke="none" stroke-width="1"/><text x="260" y="142" font-size="14" fill="#5c6f68" font-family="Menlo, Consolas, monospace" text-anchor="start">+q</text><line x1="332.5" y1="150.0" x2="382.0" y2="150.0" stroke="#6d9dd6" stroke-width="1.4"/><circle cx="382.0" cy="150.0" r="2.5" fill="#6d9dd6" stroke="none" stroke-width="1"/><line x1="308.33634814803617" y1="208.33627074771852" x2="343.33815703685787" y2="243.3380331963496" stroke="#6d9dd6" stroke-width="1.4"/><circle cx="343.33815703685787" cy="243.3380331963496" r="2.5" fill="#6d9dd6" stroke="none" stroke-width="1"/><line x1="250.00010946057898" y1="232.49999999992738" x2="250.00017513692637" y2="281.9999999998838" stroke="#6d9dd6" stroke-width="1.4"/><circle cx="250.00017513692637" cy="281.9999999998838" r="2.5" fill="#6d9dd6" stroke="none" stroke-width="1"/><line x1="191.66380665270188" y1="208.33642554825116" x2="156.662090644323" y2="243.33828087720184" stroke="#6d9dd6" stroke-width="1.4"/><circle cx="156.662090644323" cy="243.33828087720184" r="2.5" fill="#6d9dd6" stroke="none" stroke-width="1"/><line x1="167.50000000029047" y1="150.00021892115794" x2="118.00000000046475" y2="150.00035027385272" stroke="#6d9dd6" stroke-width="1.4"/><circle cx="118.00000000046475" cy="150.00035027385272" r="2.5" fill="#6d9dd6" stroke="none" stroke-width="1"/><line x1="191.6634970516366" y1="91.6638840532249" x2="156.66159528261855" y2="56.66221448515985" stroke="#6d9dd6" stroke-width="1.4"/><circle cx="156.66159528261855" cy="56.66221448515985" r="2.5" fill="#6d9dd6" stroke="none" stroke-width="1"/><line x1="249.99967161826302" y1="67.50000000065354" x2="249.99947458922085" y2="18.000000001045663" stroke="#6d9dd6" stroke-width="1.4"/><circle cx="249.99947458922085" cy="18.000000001045663" r="2.5" fill="#6d9dd6" stroke="none" stroke-width="1"/><line x1="308.3360385461493" y1="91.66341965162698" x2="343.3376616738389" y2="56.66147144260317" stroke="#6d9dd6" stroke-width="1.4"/><circle cx="343.3376616738389" cy="56.66147144260317" r="2.5" fill="#6d9dd6" stroke="none" stroke-width="1"/><text x="470" y="120" font-size="15" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="start">E = kq/r²（r=2倍基准）</text><text x="470" y="148" font-size="15" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="start">面积 = 4πr²（∝r²）</text><text x="470" y="176" font-size="15" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="start">Φ = E·4πr² = kq·4π（与r无关）</text><text x="40" y="238" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">任意闭合曲面同理：只看面内电荷。</text></g><text x="24" y="312" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">Φ = q/ε₀：通量只由面内电荷决定，与面的大小形状无关。</text><text x="24" y="336" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">为什么：库仑定律与高斯定理等价；对称分布时先定方向再算大小。</text><line x1="24" y1="348" x2="696" y2="348" stroke="#d5dfda"/></g></svg>