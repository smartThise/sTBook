<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520"><title>细棒电场：源、位移、投影与对称配对</title><rect width="800" height="520" fill="#ffffff"/><text x="20" y="28" font-size="19" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">细棒电场：源、位移、投影与对称配对</text><g transform="translate(0,45)"><text x="20" y="26" font-size="20" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">6. 相加后只剩竖直分量</text><g transform="translate(0,48)"><line x1="120" y1="250" x2="680" y2="250" stroke="#25332f" stroke-width="6"></line><text x="100" y="280" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">−L</text><text x="365" y="280" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">O：x=0</text><text x="680" y="280" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">+L</text><circle cx="400" cy="90" r="5" fill="#25332f"></circle><text x="420" y="85" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">P=(0,y)，y&gt;0</text><line x1="400" y1="90" x2="400" y2="250" stroke="#c6d2cc"></line><text x="410" y="175" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">y</text><text x="20" y="45" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">均匀正电荷细棒，线密度 λ</text><rect x="555" y="239" width="18" height="22" fill="#ffe2b6" stroke="#25332f"></rect><text x="555" y="220" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">x处，宽dx</text><rect x="226" y="239" width="18" height="22" fill="#ffe2b6" stroke="#25332f"></rect><text x="180" y="220" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">−x处同样宽dx</text><line x1="400" y1="90" x2="400" y2="5" stroke="#497563" stroke-width="3"></line><line x1="400" y1="5" x2="404.3496553411123" y2="14.004471023526769" stroke="#497563" stroke-width="3"></line><line x1="400" y1="5" x2="395.6503446588877" y2="14.004471023526769" stroke="#497563" stroke-width="3"></line><text x="420" y="35" font-size="17" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">合场朝上</text></g><text x="20" y="383" font-size="16" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">一对小段贡献2dEy；只积右半棒0≤x≤L，再乘2。</text><text x="20" y="408" font-size="16" fill="#25332f" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">原因：两支竖直分量同向，必须相加；配对抵消的是水平分量。</text><line x1="20" y1="443" x2="780" y2="443" stroke="#c6d2cc"></line></g></svg>
