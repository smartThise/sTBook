<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 412" width="780" height="412"><title>双缝干涉：光程差决定明暗</title><rect width="780" height="412" fill="#ffffff"/><text x="24" y="30" font-size="18" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">双缝干涉：光程差决定明暗</text><text x="756" y="30" font-size="13" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="end">第 2 / 3 步</text><g transform="translate(0,46)"><text x="24" y="24" font-size="17" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">2. 一级明纹 m=1</text><g transform="translate(0,36)"><text x="40" y="30" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">双缝干涉：光程差δ=d·sinθ；明纹条件δ=mλ（图中m=1）</text><circle cx="30" cy="135" r="6" fill="#e0a243" stroke="none" stroke-width="1"/><text x="18" y="121" font-size="13" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">光源</text><rect x="130" y="83" width="10" height="18" rx="2" fill="#22313a" stroke="none" stroke-width="1"/><rect x="130" y="109" width="10" height="18" rx="2" fill="#22313a" stroke="none" stroke-width="1"/><line x1="40" y1="135" x2="128" y2="105" stroke="#6d9dd6" stroke-width="1.6"/><line x1="142" y1="105" x2="560" y2="71" stroke="#6d9dd6" stroke-width="1.6"/><rect x="130" y="143" width="10" height="18" rx="2" fill="#22313a" stroke="none" stroke-width="1"/><rect x="130" y="169" width="10" height="18" rx="2" fill="#22313a" stroke="none" stroke-width="1"/><line x1="40" y1="135" x2="128" y2="165" stroke="#6d9dd6" stroke-width="1.6"/><line x1="142" y1="165" x2="560" y2="71" stroke="#6d9dd6" stroke-width="1.6"/><line x1="560" y1="50" x2="560" y2="220" stroke="#d9e2dd" stroke-width="3"/><text x="566" y="60" font-size="13" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">屏</text><circle cx="572" cy="71" r="6" fill="#e0a243" stroke="none" stroke-width="1"/><text x="588" y="75" font-size="13" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="start">m=1明纹</text><text x="40" y="244" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">δ=λ：一级明纹。</text></g><text x="24" y="322" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">向上偏转使δ=d·sinθ恰好等于一个波长λ：同相叠加，一级明纹。</text><text x="24" y="346" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">为什么：sinθ=λ/d决定一级明纹的偏角。</text><line x1="24" y1="358" x2="756" y2="358" stroke="#d5dfda"/></g></svg>