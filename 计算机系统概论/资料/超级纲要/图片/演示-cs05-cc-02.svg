<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 352" width="740" height="352"><title>条件码：cmp之后ZF/SF/OF</title><rect width="740" height="352" fill="#ffffff"/><text x="24" y="30" font-size="18" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">条件码：cmp之后ZF/SF/OF</text><text x="716" y="30" font-size="13" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="end">第 2 / 3 步</text><g transform="translate(0,46)"><text x="24" y="24" font-size="17" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">2. cmp后ZF=0：不等</text><g transform="translate(0,36)"><text x="40" y="30" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">cmp %rax, %rbx：做减法rbx−rax，只写条件码不改寄存器</text><rect x="40" y="80" width="118" height="50" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="99" y="100" font-size="14" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="middle">ZF</text><text x="99" y="120" font-size="18" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">0</text><rect x="170" y="80" width="118" height="50" rx="8" fill="#d9eaf9" stroke="#d9e2dd" stroke-width="1.5"/><text x="229" y="100" font-size="14" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="middle">SF</text><text x="229" y="120" font-size="18" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">1</text><rect x="300" y="80" width="118" height="50" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="359" y="100" font-size="14" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="middle">OF</text><text x="359" y="120" font-size="18" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">0</text><text x="40" y="182" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">结果非0（SF=1示意差值为负）。　跳转判断：ZF=1 → je（相等）。</text></g><text x="24" y="262" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">rbx != rax：结果非0，ZF=0。</text><text x="24" y="286" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">为什么：此时jne成立。</text><line x1="24" y1="298" x2="716" y2="298" stroke="#d5dfda"/></g></svg>