<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="670" viewBox="0 0 1000 670"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#56748c"/></marker></defs><rect width="100%" height="100%" fill="#fafcfe"/><g font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif"><text x="22" y="40" font-size="27" fill="#172c40" text-anchor="start">两条无条件fork：创建关系不等于运行先后</text><path d="M500,165 L260,260" fill="none" stroke="#56748c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M500,165 L750,260" fill="none" stroke="#56748c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M260,355 L260,450" fill="none" stroke="#56748c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="350" y="80" width="300" height="90" rx="5" fill="#d9eafa" stroke="#667c90" stroke-width="2"/><text x="500" y="115" font-size="24" fill="#172c40" text-anchor="middle">P (PID100)</text><text x="500" y="150" font-size="23" fill="#172c40" text-anchor="middle">r1=101, r2=102</text><rect x="110" y="265" width="300" height="90" rx="5" fill="#d9eafa" stroke="#667c90" stroke-width="2"/><text x="260" y="300" font-size="24" fill="#172c40" text-anchor="middle">C1 (PID101)</text><text x="260" y="335" font-size="23" fill="#172c40" text-anchor="middle">r1=0, r2=103</text><rect x="600" y="265" width="300" height="90" rx="5" fill="#d9eafa" stroke="#667c90" stroke-width="2"/><text x="750" y="300" font-size="24" fill="#172c40" text-anchor="middle">C2 (PID102)</text><text x="750" y="335" font-size="23" fill="#172c40" text-anchor="middle">r1=101, r2=0</text><rect x="110" y="455" width="300" height="90" rx="5" fill="#d9eafa" stroke="#667c90" stroke-width="2"/><text x="260" y="490" font-size="24" fill="#172c40" text-anchor="middle">C3 (PID103)</text><text x="260" y="525" font-size="23" fill="#172c40" text-anchor="middle">r1=0, r2=0</text><text x="80" y="220" font-size="21" fill="#172c40" text-anchor="start">P第一次fork</text><text x="685" y="220" font-size="21" fill="#172c40" text-anchor="start">P第二次fork</text><text x="280" y="420" font-size="21" fill="#172c40" text-anchor="start">C1第二次fork</text><text x="22" y="620" font-size="22" fill="#172c40" text-anchor="start">PID只是示意编号。C2继承已执行第一条后的r1，不重跑程序。</text></g></svg>
