<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 372" width="740" height="372"><title>8位补码溢出：127+1=−128</title><rect width="740" height="372" fill="#ffffff"/><text x="24" y="30" font-size="18" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">8位补码溢出：127+1=−128</text><text x="716" y="30" font-size="13" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="end">第 2 / 3 步</text><g transform="translate(0,46)"><text x="24" y="24" font-size="17" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">2. 加1：10000000</text><g transform="translate(0,36)"><text x="52" y="30" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">8位补码：int8_t a = 127; a = a + 1; 会得到什么？</text><rect x="52" y="100" width="82" height="50" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="93.0" y="131" font-size="19" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">1</text><text x="93.0" y="168" font-size="11" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">2^7</text><rect x="138" y="100" width="82" height="50" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="179.0" y="131" font-size="19" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">0</text><text x="179.0" y="168" font-size="11" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">2^6</text><rect x="224" y="100" width="82" height="50" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="265.0" y="131" font-size="19" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">0</text><text x="265.0" y="168" font-size="11" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">2^5</text><rect x="310" y="100" width="82" height="50" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="351.0" y="131" font-size="19" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">0</text><text x="351.0" y="168" font-size="11" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">2^4</text><rect x="396" y="100" width="82" height="50" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="437.0" y="131" font-size="19" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">0</text><text x="437.0" y="168" font-size="11" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">2^3</text><rect x="482" y="100" width="82" height="50" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="523.0" y="131" font-size="19" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">0</text><text x="523.0" y="168" font-size="11" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">2^2</text><rect x="568" y="100" width="82" height="50" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="609.0" y="131" font-size="19" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">0</text><text x="609.0" y="168" font-size="11" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">2^1</text><rect x="654" y="100" width="82" height="50" rx="8" fill="#d9eaf9" stroke="#d9e2dd" stroke-width="1.5"/><text x="695.0" y="131" font-size="19" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">0</text><text x="695.0" y="168" font-size="11" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">2^0</text><rect x="52" y="176" width="220" height="26" rx="8" fill="#d9eaf9" stroke="#6d9dd6" stroke-width="1.5"/><text x="162.0" y="193.68" font-size="13" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="middle">符号位=最高位</text><text x="292" y="192" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">位串变成10000000。</text></g><text x="24" y="282" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">末位+1产生连续进位，得10000000。</text><text x="24" y="306" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">为什么：补码规则下最高位是符号位：1开头即负数。</text><line x1="24" y1="318" x2="716" y2="318" stroke="#d5dfda"/></g></svg>