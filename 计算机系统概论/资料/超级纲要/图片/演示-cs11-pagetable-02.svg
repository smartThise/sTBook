<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 382" width="760" height="382"><title>页表翻译：0x12AB怎样到0x3AAB</title><rect width="760" height="382" fill="#ffffff"/><text x="24" y="30" font-size="18" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">页表翻译：0x12AB怎样到0x3AAB</text><text x="736" y="30" font-size="13" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="end">第 2 / 2 步</text><g transform="translate(0,46)"><text x="24" y="24" font-size="17" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">2. 查页表替换页号</text><g transform="translate(0,36)"><text x="50" y="30" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">翻译。</text><rect x="50" y="96" width="200" height="48" rx="8" fill="#d9eaf9" stroke="#6d9dd6" stroke-width="1.5"/><rect x="154" y="96" width="96" height="48" rx="0" fill="#ffe9c4" stroke="#e0a243" stroke-width="1.5"/><text x="102" y="126" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">0x12</text><text x="202" y="126" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">AB</text><text x="102" y="158" font-size="11" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="middle">虚拟页号</text><text x="202" y="158" font-size="11" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="middle">页内偏移</text><text x="290" y="126" font-size="15" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="start">页表：0x12 → 0x3A（驻留、可读）</text><rect x="90" y="188" width="200" height="48" rx="8" fill="#d9eaf9" stroke="#6d9dd6" stroke-width="1.5"/><rect x="194" y="188" width="96" height="48" rx="0" fill="#ffe9c4" stroke="#e0a243" stroke-width="1.5"/><text x="142" y="218" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">0x3A</text><text x="242" y="218" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">AB</text><text x="142" y="250" font-size="11" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="middle">物理页框</text><text x="242" y="250" font-size="11" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="middle">偏移不变</text><text x="50" y="216" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">物理地址=0x3A00+0xAB=0x3AAB。</text></g><text x="24" y="292" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">页表把虚拟页0x12翻译为物理页框0x3A；偏移原样保留。</text><text x="24" y="316" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">为什么：翻译只改页号，页内字节次序不受影响。</text><line x1="24" y1="328" x2="736" y2="328" stroke="#d5dfda"/></g></svg>