<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="625" viewBox="0 0 1030 625"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#56748c"/></marker></defs><rect width="100%" height="100%" fill="#fafcfe"/><g font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif"><text x="22" y="40" font-size="26" fill="#172c40" text-anchor="start">写时复制：父子虚拟地址不变，父映射和内容改变</text><text x="25" y="100" font-size="25" fill="#172c40" text-anchor="start">写入前</text><rect x="25" y="145" width="265" height="65" rx="5" fill="#d9eafa" stroke="#667c90" stroke-width="2"/><text x="37" y="183" font-size="19" fill="#172c40" text-anchor="start">父：VA0x0520 / VPN5</text><rect x="25" y="285" width="265" height="65" rx="5" fill="#d9eafa" stroke="#667c90" stroke-width="2"/><text x="37" y="323" font-size="19" fill="#172c40" text-anchor="start">子：VA0x0520 / VPN5</text><rect x="335" y="210" width="150" height="105" rx="5" fill="#d4efdf" stroke="#667c90" stroke-width="2"/><text x="410" y="245" font-size="21" fill="#172c40" text-anchor="middle">物理页框9</text><text x="410" y="280" font-size="20" fill="#172c40" text-anchor="middle">偏移0x20: 7</text><path d="M292,177 L330,240" fill="none" stroke="#56748c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M292,317 L330,285" fill="none" stroke="#56748c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="525" y="100" font-size="25" fill="#172c40" text-anchor="start">父写入20后</text><rect x="525" y="145" width="265" height="65" rx="5" fill="#d9eafa" stroke="#667c90" stroke-width="2"/><text x="537" y="183" font-size="19" fill="#172c40" text-anchor="start">父：VA0x0520 / VPN5</text><rect x="525" y="285" width="265" height="65" rx="5" fill="#d9eafa" stroke="#667c90" stroke-width="2"/><text x="537" y="323" font-size="19" fill="#172c40" text-anchor="start">子：VA0x0520 / VPN5</text><rect x="835" y="145" width="150" height="85" rx="5" fill="#d4efdf" stroke="#667c90" stroke-width="2"/><text x="910" y="174" font-size="18" fill="#172c40" text-anchor="middle">页框12 (0x0C)</text><text x="910" y="207" font-size="20" fill="#172c40" text-anchor="middle">偏移0x20: 20</text><path d="M792,178 L830,178" fill="none" stroke="#56748c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="835" y="285" width="150" height="85" rx="5" fill="#d4efdf" stroke="#667c90" stroke-width="2"/><text x="910" y="314" font-size="18" fill="#172c40" text-anchor="middle">页框9</text><text x="910" y="347" font-size="20" fill="#172c40" text-anchor="middle">偏移0x20: 7</text><path d="M792,318 L830,318" fill="none" stroke="#56748c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="22" y="470" font-size="22" fill="#172c40" text-anchor="start">页大小256字节，偏移0x20。页框12按十进制编号，即0x0C。</text><text x="22" y="525" font-size="22" fill="#172c40" text-anchor="start">父物理位置0x0C20值20；子物理位置0x0920值7。</text><text x="22" y="580" font-size="21" fill="#172c40" text-anchor="start">顺序：分新页并复制  ->  改父映射  ->  重试父写入；子映射不改。</text></g></svg>
