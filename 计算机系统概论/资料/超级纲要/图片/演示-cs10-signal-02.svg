<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 362" width="740" height="362"><title>信号：断点、handler与返回</title><rect width="740" height="362" fill="#ffffff"/><text x="24" y="30" font-size="18" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">信号：断点、handler与返回</text><text x="716" y="30" font-size="13" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="end">第 2 / 3 步</text><g transform="translate(0,46)"><text x="24" y="24" font-size="17" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">2. SIGINT到达：跳handler</text><g transform="translate(0,36)"><text x="40" y="30" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">信号：异步事件打断控制流，执行handler后回到断点</text><line x1="60" y1="120" x2="660" y2="120" stroke="#22313a" stroke-width="2.5"/><text x="48" y="142" font-size="13" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">main()顺序执行</text><circle cx="400" cy="120" r="7" fill="#e0a243" stroke="none" stroke-width="1"/><text x="386" y="96" font-size="13" fill="#e0a243" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">SIGINT到达</text><line x1="400" y1="127" x2="400" y2="160" stroke="#e0a243" stroke-width="1.8"/><line x1="400" y1="160" x2="490" y2="160" stroke="#e0a243" stroke-width="1.8"/><text x="418" y="180" font-size="13" fill="#e0a243" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">handler()执行</text><line x1="490" y1="160" x2="490" y2="127" stroke="#e0a243" stroke-width="1.8"/><text x="40" y="206" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">处理函数执行中。</text></g><text x="24" y="272" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">内核在断点保存现场，转去执行信号处理函数。</text><text x="24" y="296" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">为什么：处理函数与主流程并发访问同一数据——时序竞态由此而来。</text><line x1="24" y1="308" x2="716" y2="308" stroke="#d5dfda"/></g></svg>