<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 422" width="720" height="422"><title>调用栈：main→funcA→funcB的压栈弹栈</title><rect width="720" height="422" fill="#ffffff"/><text x="24" y="30" font-size="18" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">调用栈：main→funcA→funcB的压栈弹栈</text><text x="696" y="30" font-size="13" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="end">第 3 / 5 步</text><g transform="translate(0,46)"><text x="24" y="24" font-size="17" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">3. funcA调用funcB：再压栈</text><g transform="translate(0,36)"><text x="90" y="30" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">调用栈：每次调用压入一帧（参数+局部变量+返回地址），返回弹出一帧</text><rect x="90" y="60" width="340" height="52" rx="10" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="104" y="82" font-size="16" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="start">main()</text><text x="416" y="82" font-size="13" fill="#5c6f68" font-family="Menlo, Consolas, monospace" text-anchor="end">返回地址 0x0700</text><rect x="90" y="120" width="340" height="52" rx="10" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="104" y="142" font-size="16" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="start">funcA(j=81,k=27)</text><text x="416" y="142" font-size="13" fill="#5c6f68" font-family="Menlo, Consolas, monospace" text-anchor="end">返回地址 0x1000</text><rect x="90" y="180" width="340" height="52" rx="10" fill="#ffe9c4" stroke="#e0a243" stroke-width="1.5"/><text x="104" y="202" font-size="16" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="start">funcB(m=32)</text><text x="416" y="202" font-size="13" fill="#5c6f68" font-family="Menlo, Consolas, monospace" text-anchor="end">返回地址 0x1500</text><text x="450" y="84" font-size="13" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">栈底</text><text x="450" y="244" font-size="13" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">栈顶</text><text x="90" y="262" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">栈深3。</text></g><text x="24" y="332" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">funcB(k+5)=funcB(32)：新帧m=32、返回地址0x1500。</text><text x="24" y="356" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">为什么：递归同理：每层自己的参数与局部变量互不干扰。</text><line x1="24" y1="368" x2="696" y2="368" stroke="#d5dfda"/></g></svg>