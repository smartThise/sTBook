<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="575" viewBox="0 0 1000 575"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#56748c"/></marker></defs><rect width="100%" height="100%" fill="#fafcfe"/><g font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif"><text x="22" y="40" font-size="27" fill="#172c40" text-anchor="start">近相对call：五字节指令，位移相对下一条</text><text x="100" y="110" font-size="21" fill="#172c40" text-anchor="middle">0x400100</text><rect x="30" y="130" width="140" height="70" rx="5" fill="#ffe5c5" stroke="#667c90" stroke-width="2"/><text x="100" y="175" font-size="28" fill="#172c40" text-anchor="middle">E8</text><text x="265" y="110" font-size="21" fill="#172c40" text-anchor="middle">0x400101</text><rect x="195" y="130" width="140" height="70" rx="5" fill="#d9eafa" stroke="#667c90" stroke-width="2"/><text x="265" y="175" font-size="28" fill="#172c40" text-anchor="middle">FB</text><text x="430" y="110" font-size="21" fill="#172c40" text-anchor="middle">0x400102</text><rect x="360" y="130" width="140" height="70" rx="5" fill="#d9eafa" stroke="#667c90" stroke-width="2"/><text x="430" y="175" font-size="28" fill="#172c40" text-anchor="middle">00</text><text x="595" y="110" font-size="21" fill="#172c40" text-anchor="middle">0x400103</text><rect x="525" y="130" width="140" height="70" rx="5" fill="#d9eafa" stroke="#667c90" stroke-width="2"/><text x="595" y="175" font-size="28" fill="#172c40" text-anchor="middle">00</text><text x="760" y="110" font-size="21" fill="#172c40" text-anchor="middle">0x400104</text><rect x="690" y="130" width="140" height="70" rx="5" fill="#d9eafa" stroke="#667c90" stroke-width="2"/><text x="760" y="175" font-size="28" fill="#172c40" text-anchor="middle">00</text><rect x="30" y="265" width="920" height="80" rx="5" fill="#e3f0fb" stroke="#667c90" stroke-width="2"/><text x="50" y="300" font-size="25" fill="#172c40" text-anchor="start">目标S：0x400200</text><text x="50" y="330" font-size="22" fill="#172c40" text-anchor="start">下一条：0x400105；位移：0x400200 - 0x400105 = 0xFB</text><path d="M430,210 L430,255" fill="none" stroke="#56748c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="30" y="410" font-size="24" fill="#172c40" text-anchor="start">小端字段 FB 00 00 00 解码为 +251。</text><text x="30" y="465" font-size="24" fill="#172c40" text-anchor="start">CPU核对：0x400105 + 0xFB = 0x400200。</text><text x="30" y="525" font-size="23" fill="#172c40" text-anchor="start">若误从call起点减，会错算0x100，实际跳到0x400205。</text></g></svg>
