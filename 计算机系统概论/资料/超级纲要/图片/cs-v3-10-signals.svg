<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="735" viewBox="0 0 1030 735"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#56748c"/></marker></defs><rect width="100%" height="100%" fill="#fafcfe"/><g font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif"><text x="22" y="40" font-size="25" fill="#172c40" text-anchor="start">信号先到时：坏的等待丢窗口，正确等待保留挂起</text><text x="45" y="100" font-size="24" fill="#172c40" text-anchor="start">检查后再pause</text><text x="530" y="100" font-size="24" fill="#172c40" text-anchor="start">屏蔽后sigsuspend</text><rect x="25" y="130" width="460" height="58" rx="5" fill="#ffe2dc" stroke="#667c90" stroke-width="2"/><text x="39" y="166" font-size="21" fill="#172c40" text-anchor="start">读done=0，决定等待</text><path d="M255,190 L255,206" fill="none" stroke="#56748c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="25" y="210" width="460" height="58" rx="5" fill="#ffe2dc" stroke="#667c90" stroke-width="2"/><text x="39" y="246" font-size="21" fill="#172c40" text-anchor="start">信号递送：done=1</text><path d="M255,270 L255,286" fill="none" stroke="#56748c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="25" y="290" width="460" height="58" rx="5" fill="#ffe2dc" stroke="#667c90" stroke-width="2"/><text x="39" y="326" font-size="21" fill="#172c40" text-anchor="start">处理函数已返回</text><path d="M255,350 L255,366" fill="none" stroke="#56748c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="25" y="370" width="460" height="58" rx="5" fill="#ffe2dc" stroke="#667c90" stroke-width="2"/><text x="39" y="406" font-size="21" fill="#172c40" text-anchor="start">主程序才进入pause</text><path d="M255,430 L255,446" fill="none" stroke="#56748c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="25" y="450" width="460" height="58" rx="5" fill="#ffe2dc" stroke="#667c90" stroke-width="2"/><text x="39" y="486" font-size="21" fill="#172c40" text-anchor="start">没有后续信号，睡住</text><rect x="525" y="130" width="460" height="58" rx="5" fill="#d4efdf" stroke="#667c90" stroke-width="2"/><text x="539" y="166" font-size="21" fill="#172c40" text-anchor="start">先屏蔽：blocked=1</text><path d="M755,190 L755,206" fill="none" stroke="#56748c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="525" y="210" width="460" height="58" rx="5" fill="#d4efdf" stroke="#667c90" stroke-width="2"/><text x="539" y="246" font-size="21" fill="#172c40" text-anchor="start">raise：pending=1，flag=0</text><path d="M755,270 L755,286" fill="none" stroke="#56748c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="525" y="290" width="460" height="58" rx="5" fill="#d4efdf" stroke="#667c90" stroke-width="2"/><text x="539" y="326" font-size="21" fill="#172c40" text-anchor="start">检查flag=0</text><path d="M755,350 L755,366" fill="none" stroke="#56748c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="525" y="370" width="460" height="58" rx="5" fill="#d4efdf" stroke="#667c90" stroke-width="2"/><text x="539" y="406" font-size="21" fill="#172c40" text-anchor="start">sigsuspend原子解除并等待</text><path d="M755,430 L755,446" fill="none" stroke="#56748c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="525" y="450" width="460" height="58" rx="5" fill="#d4efdf" stroke="#667c90" stroke-width="2"/><text x="539" y="486" font-size="21" fill="#172c40" text-anchor="start">挂起信号递送：flag=1</text><path d="M755,510 L755,526" fill="none" stroke="#56748c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="525" y="530" width="460" height="58" rx="5" fill="#d4efdf" stroke="#667c90" stroke-width="2"/><text x="539" y="566" font-size="21" fill="#172c40" text-anchor="start">返回后先恢复屏蔽，再重查</text><text x="22" y="690" font-size="21" fill="#172c40" text-anchor="start">flag/requested是程序状态；pending是内核的待递送通知，不能混为一格。</text></g></svg>
