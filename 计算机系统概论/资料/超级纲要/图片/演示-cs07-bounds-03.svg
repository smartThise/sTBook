<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 382" width="780" height="382"><title>数组越界：a[10]=7写到谁头上</title><rect width="780" height="382" fill="#ffffff"/><text x="24" y="30" font-size="18" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">数组越界：a[10]=7写到谁头上</text><text x="756" y="30" font-size="13" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="end">第 3 / 3 步</text><g transform="translate(0,46)"><text x="24" y="24" font-size="17" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">3. 越界写与未定义行为</text><g transform="translate(0,36)"><text x="40" y="30" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">int a[5] 与相邻变量 b 在栈上的布局：a[10]=7 会写到哪里？</text><rect x="40" y="100" width="90" height="52" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="85.0" y="127" font-size="15" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">a[0]</text><text x="85.0" y="146" font-size="11" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">+0</text><rect x="134" y="100" width="90" height="52" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="179.0" y="127" font-size="15" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">a[1]</text><text x="179.0" y="146" font-size="11" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">+4</text><rect x="228" y="100" width="90" height="52" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="273.0" y="127" font-size="15" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">a[2]</text><text x="273.0" y="146" font-size="11" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">+8</text><rect x="322" y="100" width="90" height="52" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="367.0" y="127" font-size="15" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">a[3]</text><text x="367.0" y="146" font-size="11" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">+12</text><rect x="416" y="100" width="90" height="52" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="461.0" y="127" font-size="15" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">a[4]</text><text x="461.0" y="146" font-size="11" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">+16</text><rect x="510" y="100" width="90" height="52" rx="8" fill="#d9eaf9" stroke="#6d9dd6" stroke-width="1.5"/><text x="555.0" y="127" font-size="15" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">b</text><text x="555.0" y="146" font-size="11" fill="#93a39b" font-family="Menlo, Consolas, monospace" text-anchor="middle">+20</text><text x="40" y="196" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">后果不可预知，唯有不越界。</text></g><text x="24" y="292" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">C标准把越界访问定义为未定义行为：不检查、不报错、后果随布局。</text><text x="24" y="316" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">为什么：防范靠规范与工具：循环边界自查、开启-fsanitize=address等。</text><line x1="24" y1="328" x2="756" y2="328" stroke="#d5dfda"/></g></svg>