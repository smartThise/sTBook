<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 362" width="740" height="362"><title>重定向：fd 1指终端还是文件</title><rect width="740" height="362" fill="#ffffff"/><text x="24" y="30" font-size="18" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">重定向：fd 1指终端还是文件</text><text x="716" y="30" font-size="13" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="end">第 2 / 2 步</text><g transform="translate(0,46)"><text x="24" y="24" font-size="17" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">2. shell执行 ls &gt; out.txt</text><g transform="translate(0,36)"><text x="40" y="30" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">重定向：同一程序，stdout指向终端还是文件由fd表决定</text><rect x="60" y="90" width="150" height="56" rx="10" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="135" y="118" font-size="16" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">ls 进程</text><rect x="60" y="152" width="150" height="40" rx="8" fill="#eef3f0" stroke="#d5dfda" stroke-width="1.2"/><text x="135" y="177" font-size="13" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">fd 1 = stdout</text><line x1="210" y1="172" x2="430" y2="110" stroke="#6d9dd6" stroke-width="2"/><rect x="432" y="84" width="200" height="52" rx="10" fill="#d9eaf9" stroke="#6d9dd6" stroke-width="1.5"/><text x="532" y="108" font-size="15" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">out.txt</text><text x="532" y="126" font-size="12" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="middle">（文件）</text><text x="40" y="208" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">输出进文件。</text></g><text x="24" y="272" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">fork后、exec前，子进程把fd 1重新open到out.txt。</text><text x="24" y="296" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">为什么：ls本身不关心fd 1指向什么——重定向对程序透明。</text><line x1="24" y1="308" x2="716" y2="308" stroke="#d5dfda"/></g></svg>