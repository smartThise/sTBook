<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="655" viewBox="0 0 1000 655"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#56748c"/></marker></defs><rect width="100%" height="100%" fill="#fafcfe"/><g font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif"><text x="22" y="40" font-size="26" fill="#172c40" text-anchor="start">combine调用helper：每个栈格8字节，低地址在下面</text><text x="22" y="155" font-size="23" fill="#172c40" text-anchor="start">0x7FF8</text><rect x="165" y="110" width="350" height="78" rx="5" fill="#e3f0fb" stroke="#667c90" stroke-width="2"/><text x="340" y="156" font-size="23" fill="#172c40" text-anchor="middle">外部调用者返回地址</text><text x="22" y="255" font-size="23" fill="#172c40" text-anchor="start">0x7FF0</text><rect x="165" y="210" width="350" height="78" rx="5" fill="#e3f0fb" stroke="#667c90" stroke-width="2"/><text x="340" y="256" font-size="23" fill="#172c40" text-anchor="middle">保存的旧rbx=99</text><text x="22" y="355" font-size="23" fill="#172c40" text-anchor="start">0x7FE8</text><rect x="165" y="310" width="350" height="78" rx="5" fill="#e3f0fb" stroke="#667c90" stroke-width="2"/><text x="340" y="356" font-size="23" fill="#172c40" text-anchor="middle">回combine的返回地址</text><text x="22" y="445" font-size="22" fill="#172c40" text-anchor="start">helper入口：rsp=0x7FE8；rbx=5。</text><text x="560" y="135" font-size="21" fill="#172c40" text-anchor="start">combine入口</text><rect x="800" y="105" width="160" height="45" rx="5" fill="#d4efdf" stroke="#667c90" stroke-width="2"/><text x="880" y="136" font-size="21" fill="#172c40" text-anchor="middle">0x7FF8</text><text x="560" y="200" font-size="21" fill="#172c40" text-anchor="start">push rbx</text><rect x="800" y="170" width="160" height="45" rx="5" fill="#d4efdf" stroke="#667c90" stroke-width="2"/><text x="880" y="201" font-size="21" fill="#172c40" text-anchor="middle">0x7FF0</text><text x="560" y="265" font-size="21" fill="#172c40" text-anchor="start">call helper</text><rect x="800" y="235" width="160" height="45" rx="5" fill="#d4efdf" stroke="#667c90" stroke-width="2"/><text x="880" y="266" font-size="21" fill="#172c40" text-anchor="middle">0x7FE8</text><text x="560" y="330" font-size="21" fill="#172c40" text-anchor="start">helper ret</text><rect x="800" y="300" width="160" height="45" rx="5" fill="#d4efdf" stroke="#667c90" stroke-width="2"/><text x="880" y="331" font-size="21" fill="#172c40" text-anchor="middle">0x7FF0</text><text x="560" y="395" font-size="21" fill="#172c40" text-anchor="start">pop rbx</text><rect x="800" y="365" width="160" height="45" rx="5" fill="#d4efdf" stroke="#667c90" stroke-width="2"/><text x="880" y="396" font-size="21" fill="#172c40" text-anchor="middle">0x7FF8</text><text x="560" y="460" font-size="21" fill="#172c40" text-anchor="start">combine ret</text><rect x="800" y="430" width="160" height="45" rx="5" fill="#d4efdf" stroke="#667c90" stroke-width="2"/><text x="880" y="461" font-size="21" fill="#172c40" text-anchor="middle">0x8000</text><text x="22" y="560" font-size="22" fill="#172c40" text-anchor="start">helper返回10后：add把rax变15；pop恢复rbx为99；ret不改rax。</text><text x="22" y="610" font-size="22" fill="#172c40" text-anchor="start">rsp只恢复位置，不自动把刚释放栈格的旧字节清零。</text></g></svg>
