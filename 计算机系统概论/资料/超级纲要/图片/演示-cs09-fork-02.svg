<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 382" width="760" height="382"><title>fork：一次调用，两份进程</title><rect width="760" height="382" fill="#ffffff"/><text x="24" y="30" font-size="18" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">fork：一次调用，两份进程</text><text x="736" y="30" font-size="13" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="end">第 2 / 3 步</text><g transform="translate(0,46)"><text x="24" y="24" font-size="17" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">2. pid 1调用fork</text><g transform="translate(0,36)"><text x="40" y="30" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">fork：把当前进程复制一份，父子从同一行代码之后各自继续</text><rect x="214" y="46" width="92" height="48" rx="10" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="260" y="76" font-size="15" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">pid 1</text><rect x="454" y="46" width="92" height="48" rx="10" fill="#ffe9c4" stroke="#e0a243" stroke-width="1.5"/><text x="500" y="76" font-size="15" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">pid 2</text><line x1="260" y1="94" x2="500" y2="46" stroke="#d5dfda" stroke-width="1.8"/><text x="40" y="214" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">树分出一支。</text></g><text x="24" y="292" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">复制出一个pid=2：两者从fork返回处继续，fork的返回值不同——父得到孩子的pid，孩子得到0。</text><text x="24" y="316" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">为什么：用返回值区分父子，走不同的分支。</text><line x1="24" y1="328" x2="736" y2="328" stroke="#d5dfda"/></g></svg>