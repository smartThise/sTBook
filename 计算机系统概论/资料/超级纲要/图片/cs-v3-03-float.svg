<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="700" viewBox="0 0 1000 700"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#56748c"/></marker></defs><rect width="100%" height="100%" fill="#fafcfe"/><g font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif"><text x="22" y="40" font-size="27" fill="#172c40" text-anchor="start">5.25编码binary32：先求数值，再放位域</text><rect x="25" y="90" width="940" height="72" rx="5" fill="#e3f0fb" stroke="#667c90" stroke-width="2"/><text x="45" y="120" font-size="23" fill="#172c40" text-anchor="start">5.25 = 101.01（二进制）</text><text x="45" y="148" font-size="20" fill="#172c40" text-anchor="start">5=101；0.25=.01</text><rect x="25" y="190" width="940" height="72" rx="5" fill="#e3f0fb" stroke="#667c90" stroke-width="2"/><text x="45" y="220" font-size="23" fill="#172c40" text-anchor="start">101.01 = 1.0101 * 2^2</text><text x="45" y="248" font-size="20" fill="#172c40" text-anchor="start">小数点左移2格，E=2</text><rect x="25" y="290" width="940" height="72" rx="5" fill="#e3f0fb" stroke="#667c90" stroke-width="2"/><text x="45" y="320" font-size="23" fill="#172c40" text-anchor="start">q = E+127 = 129 = 10000001</text><text x="45" y="348" font-size="20" fill="#172c40" text-anchor="start">s=0；F保存隐藏1之后的0101</text><text x="22" y="425" font-size="23" fill="#172c40" text-anchor="start">抽象32位串（不是小端字节顺序）</text><text x="25" y="470" font-size="21" fill="#172c40" text-anchor="start">s：1位</text><rect x="25" y="485" width="90" height="60" rx="5" fill="#ffe5c5" stroke="#667c90" stroke-width="2"/><text x="70.0" y="525" font-size="22" fill="#172c40" text-anchor="middle">0</text><text x="125" y="470" font-size="21" fill="#172c40" text-anchor="start">q：8位</text><rect x="125" y="485" width="260" height="60" rx="5" fill="#d4efdf" stroke="#667c90" stroke-width="2"/><text x="255.0" y="525" font-size="22" fill="#172c40" text-anchor="middle">10000001</text><text x="395" y="470" font-size="21" fill="#172c40" text-anchor="start">F：23位</text><rect x="395" y="485" width="570" height="60" rx="5" fill="#e3f0fb" stroke="#667c90" stroke-width="2"/><text x="680.0" y="525" font-size="22" fill="#172c40" text-anchor="middle">01010000000000000000000</text><text x="22" y="610" font-size="21" fill="#172c40" text-anchor="start">位串十六进制：40 A8 00 00；小端内存低地址到高地址：00 00 A8 40。</text><text x="22" y="655" font-size="22" fill="#172c40" text-anchor="start">反解：(1+1/4+1/16) * 4 = 1.3125 * 4 = 5.25。</text></g></svg>
