<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="745" viewBox="0 0 1000 745"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#56748c"/></marker></defs><rect width="100%" height="100%" fill="#fafcfe"/><g font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif"><text x="22" y="40" font-size="27" fill="#172c40" text-anchor="start">最后状态：fd1/fd3共用O1，fd2独用O2</text><rect x="25" y="110" width="290" height="65" rx="5" fill="#d9eafa" stroke="#667c90" stroke-width="2"/><text x="170" y="150" font-size="22" fill="#172c40" text-anchor="middle">fd1</text><rect x="25" y="255" width="290" height="65" rx="5" fill="#d9eafa" stroke="#667c90" stroke-width="2"/><text x="170" y="295" font-size="22" fill="#172c40" text-anchor="middle">fd3 = dup(fd1)</text><rect x="25" y="400" width="290" height="65" rx="5" fill="#d9eafa" stroke="#667c90" stroke-width="2"/><text x="170" y="440" font-size="22" fill="#172c40" text-anchor="middle">fd2 = open同路径</text><rect x="470" y="140" width="470" height="90" rx="5" fill="#d4efdf" stroke="#667c90" stroke-width="2"/><text x="705" y="176" font-size="25" fill="#172c40" text-anchor="middle">O1 偏移5</text><text x="705" y="209" font-size="21" fill="#172c40" text-anchor="middle">已按次序读AB、CD、E</text><rect x="470" y="370" width="470" height="90" rx="5" fill="#d4efdf" stroke="#667c90" stroke-width="2"/><text x="705" y="406" font-size="25" fill="#172c40" text-anchor="middle">O2 偏移1</text><text x="705" y="439" font-size="21" fill="#172c40" text-anchor="middle">只读了A</text><path d="M317,143 L465,173" fill="none" stroke="#56748c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M317,288 L465,205" fill="none" stroke="#56748c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M317,433 L465,415" fill="none" stroke="#56748c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="455" y="550" width="475" height="75" rx="5" fill="#ffe5c5" stroke="#667c90" stroke-width="2"/><text x="690" y="596" font-size="25" fill="#172c40" text-anchor="middle">同一文件内容 ABCDEF</text><path d="M945,185 L990,185 L990,585 L935,585" fill="none" stroke="#56748c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M705,462 L780,545" fill="none" stroke="#56748c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="22" y="700" font-size="22" fill="#172c40" text-anchor="start">两次open有两个偏移盒子；dup只多一根指向O1的引用。</text></g></svg>
