<text x="42" y="453" font-size="17" text-anchor="start" class="">1. 算出第二行：0x1000 + 16 = 0x1010</text>
<text x="42" y="490" font-size="17" text-anchor="start" class="">2. 再跨两项：0x1010 + 8 = 0x1018</text>
<text x="42" y="527" font-size="17" text-anchor="start" class="">3. 从0x1018读取一个int，得到22</text>
<text x="42" y="581" font-size="16" text-anchor="start" class="">0x1010处是整数20，没有另存一根行指针。</text>
<text x="618" y="453" font-size="17" text-anchor="start" class="">1. 读表项：0x5000 + 1×8 = 0x5008</text>
<text x="618" y="490" font-size="17" text-anchor="start" class="">2. 表项给出行起点0x9000</text>
<text x="618" y="527" font-size="17" text-anchor="start" class="">3. 再到0x9000 + 2×4 = 0x9008，读得22</text>
<text x="618" y="581" font-size="16" text-anchor="start" class="">行可分散；先读指针，再沿它读取int。</text>
<text x="42" y="620" font-size="16" text-anchor="start" class="">橙色标最终读取的对象；所有地址为本例手算值。</text>
