<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="755" viewBox="0 0 1030 755"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#56748c"/></marker></defs><rect width="100%" height="100%" fill="#fafcfe"/><g font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif"><text x="22" y="40" font-size="25" fill="#172c40" text-anchor="start">malloc 10个int：范围[0x1000,0x1028)，每项4字节</text><text x="72" y="115" font-size="20" fill="#172c40" text-anchor="middle">i=0</text><rect x="35" y="135" width="76" height="65" rx="5" fill="#d4efdf" stroke="#667c90" stroke-width="2"/><text x="72" y="176" font-size="22" fill="#172c40" text-anchor="middle">0</text><text x="158" y="115" font-size="20" fill="#172c40" text-anchor="middle">i=1</text><rect x="121" y="135" width="76" height="65" rx="5" fill="#d4efdf" stroke="#667c90" stroke-width="2"/><text x="158" y="176" font-size="22" fill="#172c40" text-anchor="middle">1</text><text x="244" y="115" font-size="20" fill="#172c40" text-anchor="middle">i=2</text><rect x="207" y="135" width="76" height="65" rx="5" fill="#d4efdf" stroke="#667c90" stroke-width="2"/><text x="244" y="176" font-size="22" fill="#172c40" text-anchor="middle">2</text><text x="330" y="115" font-size="20" fill="#172c40" text-anchor="middle">i=3</text><rect x="293" y="135" width="76" height="65" rx="5" fill="#d4efdf" stroke="#667c90" stroke-width="2"/><text x="330" y="176" font-size="22" fill="#172c40" text-anchor="middle">3</text><text x="416" y="115" font-size="20" fill="#172c40" text-anchor="middle">i=4</text><rect x="379" y="135" width="76" height="65" rx="5" fill="#d4efdf" stroke="#667c90" stroke-width="2"/><text x="416" y="176" font-size="22" fill="#172c40" text-anchor="middle">4</text><text x="502" y="115" font-size="20" fill="#172c40" text-anchor="middle">i=5</text><rect x="465" y="135" width="76" height="65" rx="5" fill="#d4efdf" stroke="#667c90" stroke-width="2"/><text x="502" y="176" font-size="22" fill="#172c40" text-anchor="middle">5</text><text x="588" y="115" font-size="20" fill="#172c40" text-anchor="middle">i=6</text><rect x="551" y="135" width="76" height="65" rx="5" fill="#d4efdf" stroke="#667c90" stroke-width="2"/><text x="588" y="176" font-size="22" fill="#172c40" text-anchor="middle">6</text><text x="674" y="115" font-size="20" fill="#172c40" text-anchor="middle">i=7</text><rect x="637" y="135" width="76" height="65" rx="5" fill="#d4efdf" stroke="#667c90" stroke-width="2"/><text x="674" y="176" font-size="22" fill="#172c40" text-anchor="middle">7</text><text x="760" y="115" font-size="20" fill="#172c40" text-anchor="middle">i=8</text><rect x="723" y="135" width="76" height="65" rx="5" fill="#d4efdf" stroke="#667c90" stroke-width="2"/><text x="760" y="176" font-size="22" fill="#172c40" text-anchor="middle">8</text><text x="846" y="115" font-size="20" fill="#172c40" text-anchor="middle">i=9</text><rect x="809" y="135" width="76" height="65" rx="5" fill="#d4efdf" stroke="#667c90" stroke-width="2"/><text x="846" y="176" font-size="22" fill="#172c40" text-anchor="middle">9</text><text x="932" y="115" font-size="20" fill="#172c40" text-anchor="middle">i=10</text><rect x="895" y="135" width="76" height="65" rx="5" fill="#ffd6cc" stroke="#bb4633" stroke-width="2"/><text x="932" y="176" font-size="22" fill="#172c40" text-anchor="middle">10</text><text x="35" y="250" font-size="22" fill="#172c40" text-anchor="start">0x1000</text><text x="800" y="250" font-size="22" fill="#172c40" text-anchor="start">0x1024</text><text x="890" y="300" font-size="20" fill="#172c40" text-anchor="end">0x1028：尾后</text><path d="M932,205 L930,270" fill="none" stroke="#56748c" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="35" y="370" width="920" height="65" rx="5" fill="#d4efdf" stroke="#667c90" stroke-width="2"/><text x="55" y="410" font-size="24" fill="#172c40" text-anchor="start">i=9：写0x1024..0x1027，仍合法</text><rect x="35" y="465" width="920" height="65" rx="5" fill="#ffd6cc" stroke="#667c90" stroke-width="2"/><text x="55" y="505" font-size="24" fill="#172c40" text-anchor="start">i=10：写0x1028..0x102B，第一次越界</text><rect x="35" y="560" width="920" height="65" rx="5" fill="#ffe5c5" stroke="#667c90" stroke-width="2"/><text x="55" y="600" font-size="24" fill="#172c40" text-anchor="start">之后free：可能此时才发现之前的损坏</text><text x="22" y="710" font-size="22" fill="#172c40" text-anchor="start">红格在对象之外；它实际属于谁，不由这个程序的分配请求决定。</text></g></svg>
