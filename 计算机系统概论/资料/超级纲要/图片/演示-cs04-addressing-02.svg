<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 372" width="740" height="372"><title>基址加偏移：0x8(%rbx)指到哪里</title><rect width="740" height="372" fill="#ffffff"/><text x="24" y="30" font-size="18" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">基址加偏移：0x8(%rbx)指到哪里</text><text x="716" y="30" font-size="13" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="end">第 2 / 2 步</text><g transform="translate(0,46)"><text x="24" y="24" font-size="17" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">2. 基址+偏移求和</text><g transform="translate(0,36)"><text x="50" y="30" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">mov %rax, 0x8(%rbx)：目标地址 = (%rbx) + 0x8</text><rect x="50" y="100" width="250" height="46" rx="8" fill="#d9eaf9" stroke="#6d9dd6" stroke-width="1.5"/><text x="175" y="129" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">%rbx = 0x1000</text><rect x="330" y="100" width="140" height="46" rx="8" fill="#f5f8f6" stroke="#d9e2dd" stroke-width="1.5"/><text x="400" y="129" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">+ 0x8</text><rect x="500" y="100" width="220" height="46" rx="8" fill="#ffe9c4" stroke="#e0a243" stroke-width="1.5"/><text x="610" y="129" font-size="17" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">目标 0x1008</text><text x="50" y="200" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">%rax写入0x1008。</text></g><text x="24" y="282" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">0x1000 + 0x8 = 0x1008：第2个int元素（下标2，因int占4字节，偏移=2×4=8）。</text><text x="24" y="306" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">为什么：结构体字段、数组下标最终都编译成这种基址+偏移形式。</text><line x1="24" y1="318" x2="716" y2="318" stroke="#d5dfda"/></g></svg>