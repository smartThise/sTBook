<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="740" viewBox="0 0 1000 740"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#56748c"/></marker></defs><rect width="100%" height="100%" fill="#fafcfe"/><g font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif"><text x="22" y="40" font-size="26" fill="#172c40" text-anchor="start">sum({4,-2,7},3)：地址、位串与累加器同时跟</text><text x="350" y="105" font-size="23" fill="#172c40" text-anchor="middle">0x1000</text><rect x="250" y="125" width="200" height="70" rx="5" fill="#d4efdf" stroke="#667c90" stroke-width="2"/><text x="350" y="168" font-size="22" fill="#172c40" text-anchor="middle">4 (long8字节)</text><text x="585" y="105" font-size="23" fill="#172c40" text-anchor="middle">0x1008</text><rect x="485" y="125" width="200" height="70" rx="5" fill="#d4efdf" stroke="#667c90" stroke-width="2"/><text x="585" y="168" font-size="22" fill="#172c40" text-anchor="middle">-2 (long8字节)</text><text x="820" y="105" font-size="23" fill="#172c40" text-anchor="middle">0x1010</text><rect x="720" y="125" width="200" height="70" rx="5" fill="#d4efdf" stroke="#667c90" stroke-width="2"/><text x="820" y="168" font-size="22" fill="#172c40" text-anchor="middle">7 (long8字节)</text><text x="22" y="260" font-size="23" fill="#172c40" text-anchor="start">-2的64位位串：0xFFFFFFFFFFFFFFFE。</text><text x="22" y="348" font-size="22" fill="#172c40" text-anchor="start">初始化</text><rect x="400" y="315" width="220" height="50" rx="5" fill="#e3f0fb" stroke="#667c90" stroke-width="2"/><text x="420" y="349" font-size="23" fill="#172c40" text-anchor="start">rax=0</text><rect x="670" y="315" width="220" height="50" rx="5" fill="#ffe5c5" stroke="#667c90" stroke-width="2"/><text x="690" y="349" font-size="23" fill="#172c40" text-anchor="start">rdx(i)=0</text><text x="22" y="423" font-size="22" fill="#172c40" text-anchor="start">加地址1000的4</text><rect x="400" y="390" width="220" height="50" rx="5" fill="#e3f0fb" stroke="#667c90" stroke-width="2"/><text x="420" y="424" font-size="23" fill="#172c40" text-anchor="start">rax=4</text><rect x="670" y="390" width="220" height="50" rx="5" fill="#ffe5c5" stroke="#667c90" stroke-width="2"/><text x="690" y="424" font-size="23" fill="#172c40" text-anchor="start">rdx(i)=1</text><text x="22" y="498" font-size="22" fill="#172c40" text-anchor="start">加地址1008的-2</text><rect x="400" y="465" width="220" height="50" rx="5" fill="#e3f0fb" stroke="#667c90" stroke-width="2"/><text x="420" y="499" font-size="23" fill="#172c40" text-anchor="start">rax=2</text><rect x="670" y="465" width="220" height="50" rx="5" fill="#ffe5c5" stroke="#667c90" stroke-width="2"/><text x="690" y="499" font-size="23" fill="#172c40" text-anchor="start">rdx(i)=2</text><text x="22" y="573" font-size="22" fill="#172c40" text-anchor="start">加地址1010的7</text><rect x="400" y="540" width="220" height="50" rx="5" fill="#e3f0fb" stroke="#667c90" stroke-width="2"/><text x="420" y="574" font-size="23" fill="#172c40" text-anchor="start">rax=9</text><rect x="670" y="540" width="220" height="50" rx="5" fill="#ffe5c5" stroke="#667c90" stroke-width="2"/><text x="690" y="574" font-size="23" fill="#172c40" text-anchor="start">rdx(i)=3</text><text x="22" y="648" font-size="22" fill="#172c40" text-anchor="start">cmp 3-3=0，退出</text><rect x="400" y="615" width="220" height="50" rx="5" fill="#e3f0fb" stroke="#667c90" stroke-width="2"/><text x="420" y="649" font-size="23" fill="#172c40" text-anchor="start">rax=9</text><rect x="670" y="615" width="220" height="50" rx="5" fill="#ffe5c5" stroke="#667c90" stroke-width="2"/><text x="690" y="649" font-size="23" fill="#172c40" text-anchor="start">rdx(i)=3</text></g></svg>
