<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" width="760" height="352"><title>malloc/free：切割与合并</title><rect width="760" height="352" fill="#ffffff"/><text x="24" y="30" font-size="18" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">malloc/free：切割与合并</text><text x="736" y="30" font-size="13" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="end">第 2 / 3 步</text><g transform="translate(0,46)"><text x="24" y="24" font-size="17" font-weight="bold" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">2. 切割：前4字分配</text><g transform="translate(0,36)"><text x="40" y="30" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">隐式空闲链表：头部记录块大小与分配位；分配即切割、释放即合并</text><rect x="40" y="96" width="50" height="54" rx="6" fill="#d9eaf9" stroke="#6d9dd6" stroke-width="1.5"/><text x="65.0" y="120" font-size="15" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">64</text><text x="65.0" y="138" font-size="11" fill="#6d9dd6" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="middle">已分配</text><rect x="94" y="96" width="23" height="54" rx="6" fill="#eef3f0" stroke="#93a39b" stroke-width="1.5"/><text x="105.5" y="120" font-size="15" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">32</text><text x="105.5" y="138" font-size="11" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="middle">空闲</text><rect x="121" y="96" width="36" height="54" rx="6" fill="#d9eaf9" stroke="#6d9dd6" stroke-width="1.5"/><text x="139.0" y="120" font-size="15" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">48</text><text x="139.0" y="138" font-size="11" fill="#6d9dd6" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="middle">已分配</text><rect x="161" y="96" width="23" height="54" rx="6" fill="#d9eaf9" stroke="#6d9dd6" stroke-width="1.5"/><text x="172.5" y="120" font-size="15" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">32</text><text x="172.5" y="138" font-size="11" fill="#6d9dd6" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="middle">已分配</text><rect x="188" y="96" width="23" height="54" rx="6" fill="#eef3f0" stroke="#93a39b" stroke-width="1.5"/><text x="199.5" y="120" font-size="15" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">32</text><text x="199.5" y="138" font-size="11" fill="#93a39b" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="middle">空闲</text><rect x="215" y="96" width="36" height="54" rx="6" fill="#d9eaf9" stroke="#6d9dd6" stroke-width="1.5"/><text x="233.0" y="120" font-size="15" fill="#22313a" font-family="Menlo, Consolas, monospace" text-anchor="middle">48</text><text x="233.0" y="138" font-size="11" fill="#6d9dd6" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="middle">已分配</text><text x="40" y="188" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif" text-anchor="start">malloc(32)完成。</text></g><text x="24" y="262" font-size="15" fill="#22313a" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">8字空闲块切出4字给malloc，剩下4字仍是空闲块。</text><text x="24" y="286" font-size="15" fill="#5c6f68" font-family="PingFang SC, Noto Sans CJK SC, sans-serif">为什么：切割让空闲块越来越碎——碎片化由此而来。</text><line x1="24" y1="298" x2="736" y2="298" stroke="#d5dfda"/></g></svg>