<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="855" viewBox="0 0 1000 855"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#56748c"/></marker></defs><rect width="100%" height="100%" fill="#fafcfe"/><g font-family="PingFang SC,Noto Sans CJK SC,Arial,sans-serif"><text x="22" y="40" font-size="27" fill="#172c40" text-anchor="start">n=3,val=4：每次跳回顶部之前都推进i</text><rect x="330" y="80" width="300" height="65" rx="5" fill="#e3f0fb" stroke="#667c90" stroke-width="2"/><text x="480.0" y="120" font-size="23" fill="#172c40" text-anchor="middle">初始化 i=0,x=0</text><rect x="330" y="210" width="300" height="65" rx="5" fill="#e3f0fb" stroke="#667c90" stroke-width="2"/><text x="480.0" y="250" font-size="23" fill="#172c40" text-anchor="middle">顶部检查 i&lt;n？</text><rect x="330" y="340" width="300" height="65" rx="5" fill="#e3f0fb" stroke="#667c90" stroke-width="2"/><text x="480.0" y="380" font-size="23" fill="#172c40" text-anchor="middle">x加2</text><rect x="330" y="470" width="300" height="65" rx="5" fill="#e3f0fb" stroke="#667c90" stroke-width="2"/><text x="480.0" y="510" font-size="23" fill="#172c40" text-anchor="middle">内部检查 x&gt;val？</text><rect x="710" y="470" width="220" height="65" rx="5" fill="#e3f0fb" stroke="#667c90" stroke-width="2"/><text x="820.0" y="510" font-size="23" fill="#172c40" text-anchor="middle">x再加3</text><rect x="330" y="620" width="300" height="65" rx="5" fill="#e3f0fb" stroke="#667c90" stroke-width="2"/><text x="480.0" y="660" font-size="23" fill="#172c40" text-anchor="middle">i加1，回顶部</text><rect x="710" y="210" width="220" height="65" rx="5" fill="#e3f0fb" stroke="#667c90" stroke-width="2"/><text x="820.0" y="250" font-size="23" fill="#172c40" text-anchor="middle">退出，返回x</text><path d="M480,145 L480,205" fill="none" stroke="#56748c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M480,275 L480,335" fill="none" stroke="#56748c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M480,405 L480,465" fill="none" stroke="#56748c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M630,500 L705,500" fill="none" stroke="#56748c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M480,535 L480,615" fill="none" stroke="#56748c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M630,242 L705,242" fill="none" stroke="#56748c" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M820,535 L620,615" fill="none" stroke="#56748c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="650" y="230" font-size="21" fill="#172c40" text-anchor="start">否</text><text x="490" y="305" font-size="21" fill="#172c40" text-anchor="start">是</text><text x="650" y="487" font-size="21" fill="#172c40" text-anchor="start">是</text><text x="490" y="580" font-size="21" fill="#172c40" text-anchor="start">否</text><path d="M330,652 L240,652 L240,242 L325,242" stroke="#56748c" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="22" y="760" font-size="24" fill="#172c40" text-anchor="start">本例每轮末(i,x)：(1,2)、(2,4)、(3,9)。</text><text x="22" y="810" font-size="23" fill="#172c40" text-anchor="start">顶部第四次看见3&gt;=3，直接退出，不再多加2。</text></g></svg>
